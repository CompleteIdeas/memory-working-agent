openapi: 3.1.0
info:
  title: MWA client API
  version: 1.0.0
  description: |
    The API the MWA v2 web app (installed as a PWA) and a future phone app drive. Hand-written on purpose: this file
    is the contract a second client is built against, so internal shapes stay out of it.

    Conventions:
    - JSON in and out; every error is `{"error": {"code", "message"}}`.
    - Every write (POST/PUT/PATCH/DELETE) needs an `Idempotency-Key` header (8–128 of `A-Z a-z 0-9 . _ : -`). A retry
      with the same key gets the first answer back (`Idempotent-Replay: true`) and does not act twice.
    - Send `X-MWA-Client: web/<version>` (or `android/<version>`). A client older than `minClient` (see /meta) gets
      `426 client_too_old` and must reload.
    - Additive changes only within v1 (clients ignore fields they do not know); a breaking change is /api/v2.
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mwa_session
      description: The password session (MWA_ACCESS_PASSWORD). With no password configured, only requests made on the server's own machine are trusted without a device.
    device:
      type: apiKey
      in: cookie
      name: mwa_device
      description: A paired device, as an HttpOnly cookie (the installed web app).
    bearer:
      type: http
      scheme: bearer
      description: A paired device's token (a phone app). Not subject to the cross-site check.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, description: 'Stable, machine-readable: locked, forbidden, not_found, method_not_allowed, cross_origin, idempotency_key_required, idempotency_key_reused, in_progress, client_too_old, bad_json, bad_path, too_large, pair_code_invalid, too_many_attempts, not_a_device, internal; calendar: bad_range, bad_draft, bad_provider, removed, confirmed, no_calendar, needs_reconnect, calendar_error, deleted_in_calendar, removed_but_added; mail: bad_cursor, bad_limit, bad_body, too_long, gone, not_connected, read_only, provider_unavailable, unknown_collection; projects: bad_name, name_taken, general, archived, bad_text, bad_cursor, bad_limit, bad_body, busy, unavailable, not_movable, running, same, nothing_running, no_offer; important: bad_group, bad_state, bad_scope, not_handled, not_open, no_action, freemail_domain, kind_not_available, unavailable; push (P3): bad_endpoint, bad_keys, endpoint_taken, too_many, bad_kinds, bad_time, bad_quiet, not_subscribed, too_many_tests; W5 settings and files: no_password, wrong_password, not_a_session, bad_body, bad_name, bad_time_zone, bad_url, bad_limit, bad_cap, fixed, bad_config, no_file, no_name, empty_file, unsafe_document, busy, storage_full. A refusal that may not hold on a retry (in_progress, no_calendar, needs_reconnect, calendar_error, read_only, provider_unavailable, busy, unavailable) is not remembered against the Idempotency-Key: retrying with the same key runs again.' }
            message: { type: string, description: Plain words for a person. }
    Scope:
      type: string
      enum: [read, act, approve, admin]
    PairCode:
      type: object
      required: [code, expiresAt, pairUrl, scopes]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$', description: One-time, valid 10 minutes. }
        expiresAt: { type: integer }
        pairUrl: { type: string, description: 'Show as a QR code: <origin>/pair#c=CODE (the fragment never reaches a server). Opened at localhost, it uses the helper''s public address (MWA_PUBLIC_URL, Settings, or the tailnet name in MWA_ALLOWED_HOSTS).' }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        reachable: { type: boolean, description: 'false: no public address is known and the link says "localhost", which a phone cannot open. Ask for the helper''s address (PATCH /settings publicUrl).' }
    PairResult:
      type: object
      required: [deviceId, scopes]
      additionalProperties: false
      properties:
        deviceId: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        token: { type: string, description: 'Only when the request asked for it (cookie false): keep it secret; it is shown once.' }
    Device:
      type: object
      required: [id, name, platform, scopes, createdAt, lastSeen, revokedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: ['string', 'null'] }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: integer }
        lastSeen: { type: ['integer', 'null'] }
        revokedAt: { type: ['integer', 'null'] }
    Revoked:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked: { type: string }
    Meta:
      type: object
      required: [api, server, minClient, secure, features, importing]
      additionalProperties: false
      properties:
        importing:
          type: ['object', 'null']
          description: 'While conversations from before projects are being imported into General: bytes done of total. Show "Importing older conversations…".'
          required: [done, total]
          additionalProperties: false
          properties:
            done: { type: integer }
            total: { type: integer }
        api: { type: string, const: v1 }
        server: { type: string, description: The server version (package.json). }
        minClient: { type: string, description: The oldest client version still accepted. }
        secure: { type: boolean, description: 'True when this request came over HTTPS or from this machine. Installing the app, offline storage and notifications need it.' }
        features: { type: array, items: { type: string } }
    Progress:
      type: [object, 'null']
      required: [done, total, unit]
      additionalProperties: false
      properties:
        done: { type: number }
        total: { type: number }
        unit: { type: string, description: 'Plural noun: pages, items, stories, steps.' }
    JobStatus:
      type: object
      description: |
        The server's word on a job, from its tries (first match wins): working › waiting (for you: an approval, or the
        dollar limit) › continuing (an automatic continuation is queued; never "failed") › stopped_by_you › partly_done
        (something is left) › stopped (could not, no progress) › scheduled (nothing has run yet) › done.
      required: [state, label, detail]
      additionalProperties: false
      properties:
        state: { type: string, enum: [working, waiting, continuing, stopped_by_you, partly_done, stopped, scheduled, done] }
        label: { type: string, description: 'The heading a person reads: "Partly done", "Result ready".' }
        detail: { type: string, description: 'One plain sentence: why, and what is left.' }
        resultReady: { type: boolean, description: 'Done, and not opened since the last try ended.' }
        primaryAction:
          type: object
          required: [action, label]
          additionalProperties: false
          properties:
            action: { type: string, enum: [stop, continue, start-over, open, review, resume] }
            label: { type: string, description: 'The button: "Finish the last 10 pages", "Continue", "Open". A Continue or Start over carries its price: "Finish the last 10 pages · about 3¢".' }
            estimate: { $ref: '#/components/schemas/Amount' }
            limitUsd: { type: number, description: 'The spending limit this action sets by default ("up to 40¢"); send capUsd to choose another.' }
            firstGuess: { type: boolean, description: 'The price rests on the default or a single sample: said as "a first guess, about 30¢".' }
    Amount:
      type: object
      description: 'An estimate, always "about": dollars rounded the way they are said (whole cents under $1, 5-cent steps above) and milliseconds.'
      required: [usd, ms]
      additionalProperties: false
      properties:
        usd: { type: number, minimum: 0 }
        ms: { type: integer, minimum: 0 }
    Estimate:
      type: object
      description: |
        What Continue (what is left) and Start over (the whole job) are expected to cost and take, and the evidence:
        `this-job` (its own tries, per unit of progress or per page), `history` (the median per page over earlier runs
        on the same model tier), or `default` (a conservative guess). `continue` is absent when nothing has run yet or
        nothing is left.
      required: [basis, samples]
      additionalProperties: false
      properties:
        continue: { $ref: '#/components/schemas/Amount' }
        startOver: { $ref: '#/components/schemas/Amount' }
        basis: { type: string, enum: [this-job, history, default] }
        samples: { type: integer, minimum: 0, description: 'How many tries or past runs it rests on.' }
    CapRequest:
      type: object
      additionalProperties: false
      properties:
        capUsd: { type: number, exclusiveMinimum: 0, maximum: 20, description: 'The most the new run may spend, in dollars. Default: twice the estimate, or the estimate plus three of its largest steps and the wrap-up, whichever is more; at least 0.25 (0.50 for a first guess); at most 20. A run that reaches it waits for you.' }
    Job:
      type: object
      required: [id, kind, title, request, projectId, createdAt, updatedSeq, status, lifecycle, progress, remaining, whereItStands, seenAt, capUsd, costUsd, tries, archived, scheduleId, goalId, session, nextRunAt, estimate, estimateVsActual]
      additionalProperties: false
      properties:
        id: { type: string }
        kind: { type: string, enum: [background, recurring, reminder, plan, live] }
        title: { type: string }
        request: { type: [string, 'null'], description: "The person's own words." }
        projectId: { type: [string, 'null'] }
        createdAt: { type: integer }
        updatedSeq: { type: integer, description: 'The event sequence of its last change (the sync cursor).' }
        status: { $ref: '#/components/schemas/JobStatus' }
        lifecycle: { type: string, enum: [active, paused, cancelled] }
        progress: { $ref: '#/components/schemas/Progress' }
        remaining: { type: [string, 'null'], description: 'What is left, as the last try said it.' }
        whereItStands:
          type: [object, 'null']
          required: [text, trust]
          additionalProperties: false
          properties:
            text: { type: string }
            trust: { type: string, enum: [high, medium, untrusted] }
        seenAt: { type: [integer, 'null'] }
        capUsd: { type: [number, 'null'], description: 'The most a run of it may spend (since you last said go); at it, it waits for you.' }
        costUsd: { type: number, description: 'Spent over all its tries.' }
        tries: { type: integer, description: 'How many tries it has.' }
        archived: { type: boolean }
        scheduleId: { type: [string, 'null'] }
        goalId: { type: [string, 'null'] }
        session: { type: [string, 'null'], description: 'The conversation it reports to.' }
        nextRunAt: { type: [integer, 'null'], description: "A repeating job's next run." }
        estimate:
          oneOf:
            - { $ref: '#/components/schemas/Estimate' }
            - { type: 'null' }
          description: 'Null for a repeating job.'
        estimateVsActual:
          type: [object, 'null']
          description: 'Once done: the first estimate it was given against what it cost ("I guessed about $0.35 · it cost $0.41").'
          required: [estimatedUsd, actualUsd, text]
          additionalProperties: false
          properties:
            estimatedUsd: { type: number }
            actualUsd: { type: number }
            text: { type: string }
    Try:
      type: object
      required: [id, n, trigger, state, dueAt, startedAt, endedAt, reason, outcome, progress, remaining, costUsd, steps, toolCalls, capHit, summary, tainted, staged, estUsd, estMs, pagesRead, endedBy, delivered]
      additionalProperties: false
      properties:
        id: { type: string }
        n: { type: integer }
        trigger: { type: string, enum: [first, auto-continue, continue, start-over, fire, resume-after-restart] }
        state: { type: string, enum: [queued, running, ended] }
        dueAt: { type: [integer, 'null'] }
        startedAt: { type: [integer, 'null'] }
        endedAt: { type: [integer, 'null'] }
        reason: { type: [string, 'null'], description: 'Why its run ended: done, budget, stuck, error, paused, stopped.' }
        outcome: { type: [string, 'null'], description: 'What it achieved: changed, no-change, could-not, blocked, complete.' }
        progress: { $ref: '#/components/schemas/Progress' }
        remaining: { type: [string, 'null'] }
        costUsd: { type: [number, 'null'] }
        steps: { type: [integer, 'null'] }
        toolCalls: { type: [integer, 'null'] }
        capHit: { type: [string, 'null'], description: 'The hard limit that ended it: steps, wall, tokens, or usd (the dollar limit you set: it waits for you).' }
        summary: { type: [string, 'null'] }
        tainted: { type: boolean }
        staged: { type: array, items: { type: string }, description: 'Approvals it staged.' }
        estUsd: { type: [number, 'null'], description: 'What it was expected to cost when it was queued (about).' }
        estMs: { type: [integer, 'null'] }
        pagesRead: { type: [integer, 'null'] }
        endedBy: { type: [string, 'null'], enum: [person, cancel, self, goal-done, reaper, duplicate, null], description: 'Who ended it when its own run did not: the person, a cancel, the job itself, its goal being marked done, or the reaper (its process stopped).' }
        delivered: { type: [boolean, 'null'], description: 'False when its result was kept quiet (nothing new); null when not a scheduled fire.' }
    JobList:
      type: object
      required: [jobs, next]
      additionalProperties: false
      properties:
        jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        next: { type: [integer, 'null'], description: 'Pass as `before` for the next page; null on the last page.' }
    JobDetail:
      type: object
      required: [job, tries]
      additionalProperties: false
      properties:
        job: { $ref: '#/components/schemas/Job' }
        tries: { type: array, items: { $ref: '#/components/schemas/Try' } }
        message: { type: string, description: 'What happened, in plain words (after an action).' }
    CalendarItem:
      type: object
      description: |
        One thing on the calendar: an event from a connected calendar (kind `event`, from MWA's synced cache) or a draft
        MWA holds (kind `draft`, shown dashed until the person confirms it). Timed: `start`/`end` are UTC instants.
        All day: `start`/`end` are local dates (YYYY-MM-DD), end exclusive.
      required: [id, kind, title, start, end, allDay, location, provider]
      additionalProperties: false
      properties:
        id: { type: string, description: 'An event: "<account>:<provider id>". A draft: "cd_…".' }
        kind: { type: string, enum: [event, draft] }
        title: { type: string }
        start: { type: string }
        end: { type: string }
        allDay: { type: boolean }
        location: { type: [string, 'null'] }
        provider: { type: [string, 'null'], enum: [google, outlook, null], description: 'Which calendar; a draft not yet tied to one is null.' }
        state: { type: string, enum: [draft, confirmed, removed], description: 'Drafts only.' }
        confirmedAt: { type: [integer, 'null'], description: 'Drafts only: when the person confirmed it (ms).' }
        addedByHelper: { type: boolean, description: 'Events only: a draft the person confirmed through MWA.' }
        origin: { type: string, enum: [you, helper, helper-after-reading], description: 'Drafts only: who proposed it. helper-after-reading = the helper had read outside content (an email, a web page) first; check it before confirming.' }
        originNote: { type: string, description: 'Drafts only: a plain line about where it came from, when there is one.' }
    CalendarConflict:
      type: object
      description: Two timed things that overlap (all-day, declined and cancelled events are not counted).
      required: [id, between, titles, start, end]
      additionalProperties: false
      properties:
        id: { type: string }
        between: { type: array, items: { type: string }, minItems: 2, maxItems: 2, description: CalendarItem ids. }
        titles: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        start: { type: string, description: The overlap's start (UTC). }
        end: { type: string, description: The overlap's end (UTC). }
    CalendarView:
      type: object
      required: [from, to, items, conflicts]
      additionalProperties: false
      properties:
        from: { type: string }
        to: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/CalendarItem' } }
        conflicts: { type: array, items: { $ref: '#/components/schemas/CalendarConflict' } }
    CalendarAccount:
      type: object
      required: [account, provider, label, connected, needsReconnect, lastOk, lastError]
      additionalProperties: false
      properties:
        account: { type: string }
        provider: { type: string, enum: [google, outlook] }
        label: { type: string, description: '"Google Calendar", "Outlook".' }
        connected: { type: boolean }
        needsReconnect: { type: boolean, description: 'The sign-in was revoked or expired: ask the person to connect it again.' }
        lastOk: { type: [integer, 'null'], description: Last successful sync (ms). }
        lastError: { type: [string, 'null'] }
    CalendarAccounts:
      type: object
      required: [accounts]
      additionalProperties: false
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/CalendarAccount' } }
        results:
          type: array
          items:
            type: object
            required: [account, ok]
            additionalProperties: false
            properties:
              account: { type: string }
              ok: { type: boolean }
              skipped: { type: string, enum: [not_connected] }
              error: { type: string }
    DraftResult:
      type: object
      required: [draft, message]
      additionalProperties: false
      properties:
        draft: { $ref: '#/components/schemas/CalendarItem' }
        message: { type: string, description: 'The receipt, in plain words: "Added by your helper just now. No invites were sent."' }
        already: { type: boolean, description: 'Confirm only: it was already on the calendar; nothing new was added.' }
    MailHeader:
      type: object
      description: 'One message in the inbox, headers only (bodies are never synced or stored). The same email in two accounts is one MailHeader (the newest copy), with the others in alsoIn.'
      required: [id, account, provider, threadId, from, subject, snippet, receivedAt, unread, labels, listId, hasUnsub, alsoIn, updatedSeq, caution]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^m_[A-Za-z0-9_-]+$', description: Opaque. }
        account: { type: string, description: 'The connected account: gmail, imap or outlook.' }
        provider: { type: string, enum: [gmail, imap, outlook] }
        threadId: { type: ['string', 'null'] }
        from: { $ref: '#/components/schemas/MailFrom' }
        subject: { type: string }
        snippet: { type: string, maxLength: 200, description: 'One line of plain text (links shown as hosts). Empty for IMAP.' }
        receivedAt: { type: integer }
        unread: { type: boolean }
        labels: { type: array, items: { type: string }, description: 'Gmail labels incl. categories (CATEGORY_PROMOTIONS and so on); Outlook categories and inference:focused or inference:other.' }
        listId: { type: ['string', 'null'], description: 'The List-Id (mailing lists, newsletters).' }
        hasUnsub: { type: boolean, description: 'It carries an unsubscribe option (List-Unsubscribe).' }
        alsoIn: { type: array, items: { type: string }, description: 'Other accounts holding a copy of the same email.' }
        updatedSeq: { type: integer }
        caution: { type: ['string', 'null'], enum: [phishing, unverified, null], description: 'The same caution as on its Important item, wherever the message is shown (All email, the skipped list, the reader): phishing (the header signal fired) — warn, no reply, no Ask; unverified (urgent language from a bulk or no-reply sender) — a quieter tag. Decided by triage; a message not sorted yet gets the phishing header signal now.' }
    MailFrom:
      type: object
      required: [name, addr]
      additionalProperties: false
      properties:
        name: { type: ['string', 'null'], maxLength: 60, description: 'The display name for showing: never holds an address (anything with an "@" is removed), at most 60 characters. Always show addr as well.' }
        addr: { type: ['string', 'null'] }
    MailMessage:
      type: object
      description: 'A message opened in the reader. The body is fetched from the provider now, sanitised to plain text and kept only briefly in the server memory. It is UNTRUSTED content: show it as text, never as HTML, and fence it before a model reads it.'
      required: [id, account, provider, threadId, from, subject, snippet, receivedAt, unread, labels, listId, hasUnsub, alsoIn, updatedSeq, caution, to, replyTo, replyGoesElsewhere, replyNote, bodyText, truncated, tooComplex, quotedLinesHidden, imagesHidden, trackersRemoved, trust, fetchedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        account: { type: string }
        provider: { type: string, enum: [gmail, imap, outlook] }
        threadId: { type: ['string', 'null'] }
        from: { $ref: '#/components/schemas/MailFrom' }
        subject: { type: string }
        snippet: { type: string }
        receivedAt: { type: integer }
        unread: { type: boolean }
        labels: { type: array, items: { type: string } }
        listId: { type: ['string', 'null'] }
        hasUnsub: { type: boolean }
        alsoIn: { type: array, items: { type: string } }
        updatedSeq: { type: integer }
        caution: { type: ['string', 'null'], enum: [phishing, unverified, null], description: 'The same caution as on its Important item, wherever the message is shown (All email, the skipped list, the reader): phishing (the header signal fired) — warn, no reply, no Ask; unverified (urgent language from a bulk or no-reply sender) — a quieter tag. Decided by triage; a message not sorted yet gets the phishing header signal now.' }
        to: { type: string, description: 'The recipients line, cleaned; anything that is not a plain address shows as (unreadable address).' }
        replyTo: { type: array, items: { $ref: '#/components/schemas/MailFrom' }, description: 'Where a reply goes: the Reply-To, else the sender.' }
        replyGoesElsewhere: { type: boolean, description: 'A reply would go somewhere other than the sender (the Reply-To names another address).' }
        replyNote: { type: ['string', 'null'], description: '"Your reply will go to … (not the sender)." when replyGoesElsewhere.' }
        tooComplex: { type: boolean, description: 'The HTML could not be converted within the time budget: bodyText is the plain-text part, or a note to open it in the mail app.' }
        bodyText: { type: string, description: 'Plain text, at most 100 KB: no remote images or tracking pixels, hidden text removed, links as "words (host)" and raw URLs as their host, long quoted history collapsed to one line. Clients MUST render it as plain text with auto-linking OFF (no HTML, no linkify).' }
        truncated: { type: boolean }
        quotedLinesHidden: { type: integer }
        imagesHidden: { type: integer, description: 'Pictures not shown (their alt text appears as [picture: alt]).' }
        trackersRemoved: { type: integer, description: 'Tracking pixels removed.' }
        trust: { type: string, const: untrusted }
        fetchedAt: { type: integer }
    MailAccount:
      type: object
      required: [account, provider, label, needsReconnect, lastOk, lastError, windowFrom, syncing]
      additionalProperties: false
      properties:
        account: { type: string }
        provider: { type: string, enum: [gmail, imap, outlook] }
        label: { type: string, description: 'Gmail, Gmail (app password), Outlook.' }
        needsReconnect: { type: boolean, description: 'The sign-in is no longer valid (revoked or expired): reconnect in Settings.' }
        lastOk: { type: ['integer', 'null'] }
        lastError: { type: ['string', 'null'] }
        windowFrom: { type: ['integer', 'null'], description: 'Mail is kept from this time on (14 days).' }
        syncing: { type: boolean }
    MailRefresh:
      type: object
      required: [done, accounts, message]
      additionalProperties: false
      properties:
        done: { type: boolean }
        accounts: { type: array, items: { $ref: '#/components/schemas/MailAccount' } }
        message: { type: string }
    Project:
      type: object
      description: One of the person's groupings (Eventing, Family & school…), with one continuous thread. General always exists and cannot be archived.
      required: [id, name, icon, createdAt, sort, archived, general, updatedSeq]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: ['string', 'null'], description: 'A short icon name (letters, digits, dashes): horse, home, spark.' }
        createdAt: { type: integer }
        sort: { type: integer }
        archived: { type: boolean }
        general: { type: boolean, description: 'True for General, where a message with no clear project goes.' }
        updatedSeq: { type: integer }
    ProjectOut:
      type: object
      required: [project]
      additionalProperties: false
      properties:
        project: { $ref: '#/components/schemas/Project' }
    Turn:
      type: object
      description: |
        One entry of a project's thread. A `chat` turn holds the person's message and the answer (moving it moves both);
        `running` is a message whose answer is being written (the same turn fills in when it is done); `offer` is the
        offer to work on it in the background; `result` is a job's result posted into the thread; `divider` heads a
        conversation from before projects ("Conversation from Oct 22: …").
      required: [id, projectId, kind, ts, message, reply, truncated, reason, tainted, runId, tryId, about, provenance, offer, legacySession, movedFrom, updatedSeq, source]
      additionalProperties: false
      properties:
        id: { type: string }
        truncated: { type: boolean, description: 'True when message or reply was cut to 500 characters (/sync and the live stream send summaries; the thread has the whole turn).' }
        projectId: { type: string }
        kind: { type: string, enum: [chat, result, offer, running, divider] }
        ts: { type: integer }
        message: { type: string }
        reply: { type: string }
        reason: { type: ['string', 'null'] }
        tainted: { type: ['boolean', 'null'], description: 'True when the answer read outside content; null when not recorded (older turns).' }
        runId: { type: ['string', 'null'] }
        tryId: { type: ['string', 'null'] }
        about:
          type: ['object', 'null']
          required: [kind, id]
          additionalProperties: false
          properties:
            kind: { type: string }
            id: { type: string }
        provenance:
          type: array
          description: 'Where the memories this answer used came from, other than this thread: show "using what I know from <name>". projectId is null for "an earlier conversation" (from before projects).'
          items:
            type: object
            required: [projectId, name, n]
            additionalProperties: false
            properties:
              projectId: { type: ['string', 'null'] }
              name: { type: string }
              n: { type: integer, minimum: 1 }
        offer:
          type: ['object', 'null']
          required: [answered, at]
          additionalProperties: false
          properties:
            answered: { type: string, enum: [background, now] }
            goal: { type: string }
            at: { type: integer }
        legacySession: { type: ['string', 'null'], description: 'The conversation it came from before projects (its files stay in that folder).' }
        movedFrom: { type: ['string', 'null'], description: 'The project it was last moved out of.' }
        updatedSeq: { type: integer }
        source: { type: string, enum: [typed, voice], description: 'voice: the person spoke it (the browser turned speech into text).' }
    Suggestion:
      type: object
      description: |
        Where a message should go. Inside a project: that project ("this project"), and at most one alternative — a hint
        to offer, never a switch. From Now/Today or General: the best project ("suggested"), or General ("not sure") with
        the closest projects as alternatives.
      required: [projectId, confidence, alternatives]
      additionalProperties: false
      properties:
        projectId: { type: string }
        confidence: { type: string, enum: [suggested, not sure, this project] }
        alternatives:
          type: array
          items:
            type: object
            required: [projectId, name, score]
            additionalProperties: false
            properties:
              projectId: { type: string }
              name: { type: string }
              score: { type: number }
    ImportantItem:
      type: object
      description: |
        One thing worth a look, from any source: an important email, a dated fact found in a newsletter, a calendar
        double-booking, an email that may change an event, a job result, an approval waiting, an account to reconnect.
        Text that came from outside (a message, an invite, a model reading them) is `trust: untrusted`: render title, why
        and from as plain text with auto-linking off. `why` never holds links, addresses or phone numbers.
      required: [id, source, sourceRef, group, day, ts, from, fromAddress, caution, title, why, trust, kind, action, state, handledAt, projectId, mailId, qa, updatedSeq]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^it_[A-Za-z0-9_-]+$', description: 'Stable: the same source thing always has the same id.' }
        source: { type: string, enum: [mail, newsletter, pdf, calendar-conflict, calendar-change, deadline, waiting-reply, job-result, approval, connection] }
        sourceRef: { type: ['string', 'null'], description: 'The message, conflict, job, approval or account it came from.' }
        group: { type: string, enum: [today, week, earlier] }
        day: { type: string, description: 'The local date it appeared (YYYY-MM-DD).' }
        ts: { type: integer, description: 'When it appeared (ms): a message when it arrived, anything else when first found.' }
        from: { type: ['string', 'null'], description: '"Coach Ellen", "Calendar", "Your helper".' }
        fromAddress: { type: ['string', 'null'], description: 'The sender''s address, shown beside the display name on anything from outside.' }
        caution: { type: ['string', 'null'], enum: [phishing, unverified, null], description: 'phishing: the header signal fired (a brand the address does not belong to, a look-alike domain, urgent account language from a new or free address) — show a warning, offer only Open. unverified: urgent language from a bulk or no-reply sender.' }
        title: { type: string }
        why: { type: ['string', 'null'], description: 'One plain line on why it matters.' }
        trust: { type: string, enum: [trusted, untrusted] }
        kind: { type: ['string', 'null'], description: 'For mail: newsletter, promotion, receipt, notification, personal, work, social, other.' }
        action:
          type: [object, 'null']
          description: 'At most one action. It runs only when the person taps it (POST /items/{id}/action).'
          required: [kind, label]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [review-reply, add-to-calendar, draft-note, remind, open-job, reconnect, review-approval] }
            label: { type: string, description: '"Add to calendar", "Remind me Friday", "Reconnect"…' }
            preview:
              type: object
              description: 'add-to-calendar and remind: the date as parsed, shown to the person before any draft is made.'
              additionalProperties: false
              properties:
                date: { type: string }
                start: { type: ['string', 'null'] }
                end: { type: ['string', 'null'] }
                place: { type: ['string', 'null'] }
                tz: { type: string }
                when: { type: string, description: '"Sat Nov 14, 3–6pm".' }
        state: { type: string, enum: [open, handled, not-important, snoozed] }
        handledAt: { type: ['integer', 'null'] }
        projectId: { type: ['string', 'null'] }
        mailId: { type: ['string', 'null'], description: 'The message to open in the reader, when it came from one.' }
        qa:
          type: array
          description: '"Ask about this" answers kept under the item (written by Ask).'
          items:
            type: object
            required: [id, q, a, ts, tainted]
            additionalProperties: false
            properties:
              id: { type: string }
              q: { type: string }
              a: { type: ['string', 'null'] }
              ts: { type: integer }
              tainted: { type: boolean }
        updatedSeq: { type: integer }
    SkippedGroup:
      type: object
      required: [count, kinds, byYou]
      additionalProperties: false
      properties:
        count: { type: integer }
        kinds: { type: object, additionalProperties: { type: integer }, description: 'How many of each kind ("I skipped 5 others today: newsletters, receipts, promotions").' }
        byYou: { type: integer, description: 'How many were skipped by what the person marked not important.' }
    Sorting:
      type: object
      required: [mode, note, waiting, olderUnsorted, spentTodayUsd, capUsd, lastRunAt]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [full, rules-only, no-model, held, retrying], description: 'held: the monthly budget is used up. retrying: the model did not answer; it is tried again after a pause.' }
        waiting: { type: integer, description: 'Recent messages not sorted yet (they wait for the budget or the model, and are not listed meanwhile).' }
        olderUnsorted: { type: integer, description: 'Messages more than 2 days old not sorted yet (a first sync''s backlog, sorted while the day''s spend is low).' }
        note: { type: ['string', 'null'], description: '"I''m only sorting by your rules today (daily triage budget reached)."' }
        spentTodayUsd: { type: number }
        capUsd: { type: number }
        lastRunAt: { type: ['integer', 'null'] }
    ImportantList:
      type: object
      required: [state, groups, handledCount, skipped, sorting]
      additionalProperties: false
      properties:
        state: { type: string, enum: [open, handled, not-important] }
        groups:
          type: array
          items:
            type: object
            required: [group, label, items]
            additionalProperties: false
            properties:
              group: { type: string, enum: [today, week, earlier] }
              label: { type: string, description: 'Today, This week, Earlier.' }
              items: { type: array, items: { $ref: '#/components/schemas/ImportantItem' } }
        handledCount: { type: integer, description: 'For "Handled · N".' }
        skipped:
          type: object
          required: [today, week, earlier]
          additionalProperties: false
          properties:
            today: { $ref: '#/components/schemas/SkippedGroup' }
            week: { $ref: '#/components/schemas/SkippedGroup' }
            earlier: { $ref: '#/components/schemas/SkippedGroup' }
        sorting: { $ref: '#/components/schemas/Sorting' }
    ItemChange:
      type: object
      required: [item, message]
      additionalProperties: false
      properties:
        item: { oneOf: [{ $ref: '#/components/schemas/ImportantItem' }, { type: 'null' }] }
        message: { type: string, description: 'The receipt, in plain words: "Marked handled: …", "Got it. I''ll skip messages like this from Hillside Hardware."' }
        already: { type: boolean }
        effect:
          type: object
          description: 'What the new rule decides in the cached mail now ("This will hide mail from 14 senders").'
          required: [messages, senders]
          additionalProperties: false
          properties:
            messages: { type: integer }
            senders: { type: integer }
        rule:
          type: [object, 'null']
          description: 'The rule the person''s tap wrote, if any.'
          required: [id, match, value]
          additionalProperties: false
          properties:
            id: { type: string }
            match: { type: string, enum: [sender, domain, list-id, kind] }
            value: { type: string }
    ItemActionResult:
      type: object
      required: [kind, done, message, item]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [review-reply, add-to-calendar, draft-note, remind, open-job, reconnect, review-approval] }
        done: { type: boolean, description: 'true: something was made (a calendar DRAFT, a reminder). false: go to `route`.' }
        message: { type: string }
        item: { $ref: '#/components/schemas/ImportantItem' }
        draft: { $ref: '#/components/schemas/CalendarItem' }
        route:
          type: object
          description: 'Where the app goes next: the reader, a job, Settings, an approval, or Ask (prefilled, sent only when the person sends it).'
          required: [view]
          properties:
            view: { type: string, enum: [mail, job, settings, approval, ask] }
    ImportantRefresh:
      type: object
      required: [done, sorting, message]
      additionalProperties: false
      properties:
        done: { type: boolean }
        sorting: { $ref: '#/components/schemas/Sorting' }
        message: { type: string }
    TriageRule:
      type: object
      description: 'One rule the person taught by a tap (Not important, This was important). Rules never come from mail content.'
      required: [id, match, value, verdict, createdAt, effect]
      additionalProperties: false
      properties:
        id: { type: string }
        match: { type: string, enum: [sender, domain, list-id, kind] }
        value: { type: string }
        verdict: { type: string, enum: [important, skip] }
        createdAt: { type: integer }
        effect:
          type: object
          required: [messages, senders]
          additionalProperties: false
          properties:
            messages: { type: integer }
            senders: { type: integer }
    AskRoute:
      type: object
      description: 'Where an ask went: "To: Family & school · suggested". given = the project the person chose; about = the project of the thing it is about; suggested / not sure = the routing suggestion (not sure goes to General).'
      required: [projectId, name, confidence, alternatives]
      additionalProperties: false
      properties:
        projectId: { type: string }
        name: { type: string }
        confidence: { type: string, enum: [given, about, suggested, not sure] }
        alternatives:
          type: array
          items:
            type: object
            required: [projectId, name, score]
            additionalProperties: false
            properties:
              projectId: { type: string }
              name: { type: string }
              score: { type: number }
    AskAbout:
      type: object
      description: 'The thing an ask is about. `label` is the chip ("About: Book fair · Sat Nov 14"), for the screen only.'
      required: [kind, id, label]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [item, mail, event, draft, job, conflict] }
        id: { type: string }
        label: { type: string }
    AskFile:
      type: object
      required: [path, name, pages, reads]
      additionalProperties: false
      properties:
        path: { type: string, description: 'A workspace path, as an upload returns it.' }
        name: { type: string }
        pages: { type: integer, minimum: 1, description: 'Counted as read_document counts them (a PDF''s own pages), no model call.' }
        reads: { type: integer, minimum: 1, description: 'read_document calls it takes at the default window: the unit estimates price by.' }
    AskPlanOption:
      type: object
      required: [usd, ms, label, firstGuess, capDefault]
      additionalProperties: false
      properties:
        usd: { type: number, description: 'Rounded as said: whole cents under $1, 5-cent steps above.' }
        ms: { type: integer }
        label: { type: string, description: '"Do it now · about 40¢"; "a first guess, about …" when the estimate rests on the default or a single sample.' }
        firstGuess: { type: boolean }
        capDefault: { type: number, description: 'The spending limit this choice gets unless the person sets one.' }
        readyAt: { type: integer, description: 'In the background only: when it should be ready (epoch ms).' }
        steps: { type: integer, description: 'Do it now only: the steps the run is given (its reads + 2; 40 to 120).' }
        fits: { type: boolean, description: 'Do it now only: false when it would not finish within 120 steps or 30 minutes (it then carries on in the background).' }
        note: { type: string }
    AskPlan:
      type: object
      description: |
        A big ask, not started (SCENARIOS N04): what it is, what it would cost now (main model) and in the background
        (background model), narrower asks, and the limit it would stop at. Shown with "Or narrow it…" and "Details"
        ("Stop if it costs more than $…").
      required: [size, message, reasons, now, background, narrow, capDefault, basis]
      additionalProperties: false
      properties:
        size:
          type: object
          additionalProperties: false
          properties:
            pages: { type: integer }
            sources: { type: integer }
        message: { type: string, description: '"This is a big read — 149 pages, about 20 minutes. Do it now, or in the background for less and I''ll tell you when it''s done?"' }
        reasons: { type: array, items: { type: string, enum: [steps, cost, pages, wording] } }
        now: { $ref: '#/components/schemas/AskPlanOption' }
        background: { $ref: '#/components/schemas/AskPlanOption' }
        narrow:
          type: array
          maxItems: 3
          items:
            type: object
            required: [label, focus, files, by]
            additionalProperties: false
            properties:
              label: { type: string, description: '"Only ICP Eventing Handbook · 61 pages, about 8¢" (the name cleaned and capped).' }
              focus: { type: string, description: 'What the run is told to focus on, in fixed words: "the first attached file (61 pages)" — never a file name. For a model''s proposal it is the label itself, given to the run fenced (and the run starts tainted).' }
              files: { type: array, items: { type: string } }
              pages: { type: integer, description: 'Counted pages (file narrows only; a model''s page claim is never used).' }
              usd: { type: number, description: 'File narrows only: a model''s proposal keeps all the files and claims no price.' }
              by: { type: string, enum: [file, model], description: 'file: one per attached file, or the first 20 pages of one long file (deterministic); model: at most one label, proposed by the cheap model and checked.' }
        capDefault: { type: number }
        basis: { type: string, enum: [this-job, history, default] }
    AskStart:
      type: object
      description: |
        What an ask became. kind answer: it runs now in the project's thread (state started; or offer, the older offer
        to work on it in the background) — follow it on /stream. kind plan: a big ask waiting for POST /ask/{id}/choose.
        kind job: handed to the background (jobId, its limit, when it should be ready).
      required: [askId, projectId, route, kind]
      additionalProperties: false
      properties:
        askId: { type: string }
        projectId: { type: string }
        route: { $ref: '#/components/schemas/AskRoute' }
        kind: { type: string, enum: [answer, plan, job] }
        about: { $ref: '#/components/schemas/AskAbout' }
        state: { type: string, enum: [started, offer] }
        runId: { type: string }
        turnId: { type: string }
        message: { type: string }
        plan: { $ref: '#/components/schemas/AskPlan' }
        jobId: { type: string }
        tier: { type: string, enum: [background] }
        capUsd: { type: number }
        estimate:
          type: object
          required: [usd, ms]
          additionalProperties: false
          properties:
            usd: { type: number }
            ms: { type: integer }
        readyAt: { type: integer }
        budget:
          type: object
          description: 'An ask about one thing: 8 steps, 5¢.'
          required: [maxSteps, maxUsd]
          additionalProperties: false
          properties:
            maxSteps: { type: integer }
            maxUsd: { type: number }
        tainted: { type: boolean, description: 'An ask about one thing: the run starts tainted (the thing holds someone else''s words), so any write it attempts waits for approval.' }
    AskChosen:
      type: object
      required: [askId, chosen]
      additionalProperties: false
      properties:
        askId: { type: string }
        chosen: { type: string, enum: [now, background, narrow] }
        kind: { type: string, enum: [answer, job] }
        state: { type: string, enum: [started, offer] }
        runId: { type: string }
        turnId: { type: string }
        message: { type: string }
        capUsd: { type: number }
        jobId: { type: string }
        tier: { type: string, enum: [background] }
        estimate:
          type: object
          required: [usd, ms]
          additionalProperties: false
          properties:
            usd: { type: number }
            ms: { type: integer }
        readyAt: { type: integer }
        narrowed: { $ref: '#/components/schemas/AskStart' }
    Ask:
      type: object
      required: [id, createdAt, text, projectId, route, kind, mode, about, files, source, plan, state, choice, jobId, runId, turnId, answer, tainted, capUsd, parentId, focus, updatedSeq]
      additionalProperties: false
      properties:
        id: { type: string }
        createdAt: { type: integer }
        text: { type: string }
        projectId: { type: string }
        route: { oneOf: [{ $ref: '#/components/schemas/AskRoute' }, { type: 'null' }] }
        kind: { type: string, enum: [answer, plan, job] }
        mode: { type: ['string', 'null'] }
        about:
          type: ['object', 'null']
          required: [kind, id]
          additionalProperties: false
          properties:
            kind: { type: string }
            id: { type: string }
        files: { type: array, items: { $ref: '#/components/schemas/AskFile' } }
        source: { type: string, enum: [typed, voice] }
        plan: { oneOf: [{ $ref: '#/components/schemas/AskPlan' }, { type: 'null' }] }
        state: { type: string, enum: [planned, choosing, running, offered, answered, queued, narrowed, failed, expired], description: 'expired: a plan not chosen within a day (choose answers 410).' }
        choice: { type: ['object', 'null'] }
        jobId: { type: ['string', 'null'] }
        runId: { type: ['string', 'null'] }
        turnId: { type: ['string', 'null'] }
        answer: { type: ['string', 'null'], description: 'The answer, once written (also on the thread''s turn, and under an item).' }
        tainted: { type: ['boolean', 'null'] }
        capUsd: { type: ['number', 'null'] }
        parentId: { type: ['string', 'null'], description: 'A narrower ask: the plan it was chosen from.' }
        focus:
          type: ['object', 'null']
          description: 'A narrower ask: the fixed note said in the instruction, and a model''s suggested focus (fenced).'
          required: [note]
          additionalProperties: false
          properties:
            note: { type: string }
            suggested: { type: string }
        updatedSeq: { type: integer }
    TodayOpen:
      type: object
      description: 'Where a card or line opens, in place: a job, the waiting jobs, an approval, the approvals, a calendar item (on `date`), an Important item, an account to reconnect, an action in the activity log.'
      required: [kind, id]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [job, jobs, approval, approvals, calendar, item, reconnect, activity, mail] }
        id: { type: ['string', 'null'], description: 'The thing''s id (a job, approval, calendar item, Important item, account or action); "waiting" for jobs; null for all approvals.' }
        date: { type: string, description: 'calendar and item: the local day to open (YYYY-MM-DD).' }
        resource: { type: string, enum: [calendar, mail], description: 'reconnect: which part of the account.' }
    TodayPart:
      type: object
      description: |
        One piece of a line (W2 review): the helper's own words (`outside: false`), or words that came from outside — an
        event's title, a staged action's summary, an item's why (`outside: true`, filtered, any quote mark inside made
        plain). A screen renders outside parts as someone else's words (quoted, isolated) and never parses quotes out of
        the flat `text`, which stays for older clients.
      required: [text, outside]
      additionalProperties: false
      properties:
        text: { type: string }
        outside: { type: boolean }
    TodayNeed:
      type: object
      description: |
        One "Needs you" card. At most one per kind — approvals, jobs waiting for you, the next double-booking, an
        account to reconnect — with `count` when there are more. Never made from mail, so a phishing-flagged message is
        never one. A card shown here is not repeated in `worthALook`. Titles that came from outside (an invite, a staged
        action) are `trust: untrusted`: plain text, auto-linking off.
      required: [id, kind, count, title, text, titleParts, textParts, action, open, itemId, trust]
      additionalProperties: false
      properties:
        id: { type: string }
        kind: { type: string, enum: [approval, job, conflict, reconnect] }
        count: { type: integer, minimum: 1 }
        title: { type: string, description: '"Thursday at 4 is double-booked", "Google Calendar needs to be reconnected".' }
        text: { type: string }
        titleParts: { type: array, items: { $ref: '#/components/schemas/TodayPart' }, description: 'The title as parts (an approval''s summary, a tainted job''s title, an untrusted item''s words are outside).' }
        textParts: { type: array, items: { $ref: '#/components/schemas/TodayPart' }, description: 'The text as parts (event titles are outside).' }
        action:
          type: ['object', 'null']
          required: [kind, label]
          additionalProperties: false
          properties:
            kind: { type: string, description: 'review-approval, a job action (continue, review…), draft-note (only when the double-booking has its Important item; otherwise the card has no action and only opens the day), reconnect.' }
            label: { type: string, description: '"Review", "Finish the last 10 pages · about 3¢", "Draft the note", "Reconnect".' }
        open: { $ref: '#/components/schemas/TodayOpen' }
        itemId: { type: ['string', 'null'], description: 'The Important item this card stands for, when there is one (its action runs through POST /items/{id}/action).' }
        trust: { type: string, enum: [trusted, untrusted] }
    TodayEvent:
      type: object
      description: 'Next up: one of today''s remaining timed events (on the calendar; open drafts are not plans).'
      required: [id, kind, title, start, end, location, startLabel, soon]
      additionalProperties: false
      properties:
        id: { type: string, description: A CalendarItem id. }
        kind: { type: string, enum: [event, draft] }
        title: { type: string }
        start: { type: string, description: UTC instant. }
        end: { type: string, description: UTC instant. }
        location: { type: ['string', 'null'] }
        startLabel: { type: string, description: '"8:15 AM" in the person''s zone.' }
        soon: { type: ['string', 'null'], description: '"Now", "in 25 min" (within the hour), else null.' }
    TodayDone:
      type: object
      description: 'One "Done for you" line: something the helper did since this caller last looked, in plain words, opening the thing in place.'
      required: [id, kind, text, parts, at, open, trust]
      additionalProperties: false
      properties:
        id: { type: string }
        kind: { type: string, enum: [draft-event, event-added, job-finished, reminder, reply-drafted, email-sent, file-saved, preference] }
        text: { type: string, description: '"I added “Riley’s dentist” on Wed Nov 11 at 3:30pm as a draft. Confirm it when you see it."' }
        parts: { type: array, items: { $ref: '#/components/schemas/TodayPart' }, description: 'The line as parts: a title is outside.' }
        at: { type: integer }
        open: { $ref: '#/components/schemas/TodayOpen' }
        trust: { type: string, enum: [trusted, untrusted] }
    Today:
      type: object
      description: |
        Everything the Today screen needs, in one read, for the person's day in their own time zone (day boundaries are
        real local midnights). Read-only: no model call is made. The phone shows greeting, Needs you, Next up, Done for
        you, Worth a look and the week line; the desktop puts `worthALook` (the Important list) on the left and `agenda`
        on the right. When `freshness.calendar` is not_connected or not_synced, `nextUp` is empty because the day is
        UNKNOWN, not free: show `freshness.calendarNote` instead of "Nothing else today".
      required: [id, date, weekday, dateLabel, tz, now, greetingName, greeting, part, checkin, wrap, needsYou, nextUp, nextUpMore, agenda, doneForYou, doneMore, doneSince, worthALook, worthALookTotal, weekLine, month, status, freshness]
      additionalProperties: false
      properties:
        id: { type: string, const: today, description: 'The one document of the /sync `today` collection.' }
        date: { type: string, description: 'The local date (YYYY-MM-DD).' }
        weekday: { type: string, description: '"Monday".' }
        dateLabel: { type: string, description: '"Monday, November 9".' }
        tz: { type: string, description: 'The person''s IANA zone.' }
        now: { type: integer, description: 'The server''s now (ms) this was computed at.' }
        greetingName: { type: ['string', 'null'] }
        greeting: { type: string, description: '"Good morning, Robert".' }
        part: { type: string, enum: [morning, afternoon, evening, night] }
        checkin:
          type: ['object', 'null']
          description: 'The morning check-in, 5:00 until noon local, until the person taps "Done — show my day" (POST /today/checkin/done). Counts only: each thing appears once, in its own card below.'
          required: [title, text, spoken, trust, counts]
          additionalProperties: false
          properties:
            title: { type: string }
            text: { type: string, description: '"Here’s your Monday: 5 things on your calendar, 1 thing needs you, and I did 3 things overnight. It’s all below." Events still ahead (or all day) count.' }
            spoken: { type: string, description: 'For "Read it to me": the counts, the first thing''s time, and the first card in the helper''s own words ("Something needs your OK.") — never an event title or a staged action''s summary.' }
            trust: { type: string, enum: [trusted, untrusted], description: 'Whether text holds anything that came from outside (it does not: counts only).' }
            counts:
              type: object
              required: [events, needsYou, overnight]
              additionalProperties: false
              properties:
                events: { type: integer }
                needsYou: { type: integer }
                overnight: { type: integer }
        wrap:
          type: ['object', 'null']
          description: 'The evening wrap, from 17:00 local when the day had activity, until "Good night" (POST /today/wrap/done).'
          required: [title, lines, lineParts, spoken, trust, counts]
          additionalProperties: false
          properties:
            title: { type: string, description: '"That’s Monday".' }
            lines: { type: array, items: { type: string }, description: 'What got done today; how tomorrow starts ("Tomorrow starts at 8:15 AM with an event called “School drop-off”" — a title is quoted, filtered and at most 60 characters).' }
            lineParts: { type: array, items: { type: array, items: { $ref: '#/components/schemas/TodayPart' } }, description: 'Each line as parts (a quoted title is outside).' }
            spoken: { type: string, description: 'For "Read it to me": the same, with times only — no titles.' }
            trust: { type: string, enum: [trusted, untrusted], description: 'untrusted when `lines` quote an event title (it came from the calendar, perhaps from an invitation): plain text, auto-linking off.' }
            counts:
              type: object
              required: [eventsConfirmed, repliesDrafted, jobsFinished, doneToday]
              additionalProperties: false
              properties:
                eventsConfirmed: { type: integer }
                repliesDrafted: { type: integer }
                jobsFinished: { type: integer }
                doneToday: { type: integer }
        needsYou: { type: array, items: { $ref: '#/components/schemas/TodayNeed' }, maxItems: 4 }
        nextUp: { type: array, items: { $ref: '#/components/schemas/TodayEvent' }, maxItems: 3 }
        nextUpMore: { type: integer, description: 'More events later today than nextUp shows ("See your whole day").' }
        agenda: { type: array, items: { $ref: '#/components/schemas/CalendarItem' }, description: 'The whole local day: events and drafts (the desktop''s right-hand column).' }
        doneForYou: { type: array, items: { $ref: '#/components/schemas/TodayDone' }, maxItems: 3 }
        doneMore: { type: integer, description: '"and N more earlier".' }
        doneSince: { type: integer, description: 'Done for you lists what happened after this (ms): when this caller last looked, at most a week back; a day back for a first look.' }
        worthALook: { type: array, items: { $ref: '#/components/schemas/ImportantItem' }, maxItems: 3, description: 'The top open Important items, minus what a Needs-you card shows.' }
        worthALookTotal: { type: integer, description: '"See all (N)": every open item on the Important list.' }
        weekLine:
          type: object
          required: [text, counts]
          additionalProperties: false
          properties:
            text: { type: string, description: '"In the last 7 days: 6 replies drafted, 4 events added, 2 documents learned." Counts only.' }
            counts:
              type: object
              required: [repliesDrafted, eventsAdded, documentsLearned, jobsFinished]
              additionalProperties: false
              properties:
                repliesDrafted: { type: integer }
                eventsAdded: { type: integer, description: 'Drafts confirmed onto a calendar.' }
                documentsLearned: { type: integer, description: 'Finished jobs that worked through a document page by page.' }
                jobsFinished: { type: integer }
        month:
          type: object
          required: [usedUsd, limitUsd, state]
          additionalProperties: false
          properties:
            usedUsd: { type: number }
            limitUsd: { type: ['number', 'null'] }
            state: { type: string, enum: [none, ok, warn, over] }
        status:
          type: object
          description: 'The status pill: the same computation everywhere (src/v2/status.ts statusPill).'
          required: [text, tone, working, waiting, ready]
          additionalProperties: false
          properties:
            text: { type: string, description: '"Working on 1 thing", "Working on 1 · 1 waiting for you", "Helper is resting".' }
            tone: { type: string, enum: [needs, working, resting] }
            working: { type: integer }
            waiting: { type: integer }
            ready: { type: integer }
        freshness:
          type: object
          required: [calendarAsOf, mailAsOf, calendar, mail, calendarNote, mailNote, needsReconnect]
          additionalProperties: false
          properties:
            calendarAsOf: { type: ['integer', 'null'], description: 'The oldest last successful calendar sync among connected calendars (ms).' }
            mailAsOf: { type: ['integer', 'null'] }
            calendar: { type: string, enum: [ok, stale, partial, not_synced, reconnect, not_connected], description: 'partial: one calendar synced and another never has (named in calendarNote); the day shown is incomplete.' }
            mail: { type: string, enum: [ok, stale, partial, not_synced, reconnect, not_connected] }
            calendarNote: { type: ['string', 'null'], description: 'Say this when the calendar is not ok: "Your calendar hasn''t synced yet, so I can''t tell what''s next."' }
            mailNote: { type: ['string', 'null'] }
            needsReconnect:
              type: array
              items:
                type: object
                required: [account, resource, label]
                additionalProperties: false
                properties:
                  account: { type: string }
                  resource: { type: string, enum: [calendar, mail] }
                  label: { type: string }
    TodayAck:
      type: object
      required: [message, today]
      additionalProperties: false
      properties:
        message: { type: string, description: '"Morning check-in done. Have a good Monday.", "See you in the morning."' }
        ignored: { type: boolean, description: 'The `day` sent is not today (a tap queued yesterday): nothing was changed.' }
        today: { $ref: '#/components/schemas/Today' }
    Me:
      type: object
      description: 'Who this request is (W5). Public: a signed-out app uses it to offer the password (passwordSet) or pairing only. Signed out it says only that and whether a password is set — which the lock page shows anyway — and nothing about devices or settings.'
      required: [signedIn, kind, deviceId, deviceName, scopes, passwordSet]
      additionalProperties: false
      properties:
        signedIn: { type: boolean }
        kind: { type: ['string', 'null'], enum: [session, local, device, null], description: 'session = the password; local = this machine with no password; device = a paired device.' }
        deviceId: { type: ['string', 'null'], description: 'This device, when it is a paired one (mark it in the device list).' }
        deviceName: { type: ['string', 'null'] }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        passwordSet: { type: boolean, description: 'MWA_ACCESS_PASSWORD is set: the sign-in screen offers the password.' }
    SignedIn:
      type: object
      required: [signedIn, kind, scopes]
      additionalProperties: false
      properties:
        signedIn: { type: boolean, const: true }
        kind: { type: string, const: session }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
    Feature:
      type: object
      required: [id, label, on, canChange, note]
      additionalProperties: false
      properties:
        id: { type: string, enum: [sorting, calendar, mail] }
        label: { type: string, description: '"Sorting your mail into Important".' }
        on: { type: boolean }
        canChange: { type: boolean, description: 'false: fixed when the helper was installed (say so; offer no switch).' }
        note: { type: string, description: 'Plain words for what it does, or why it cannot be changed here.' }
    HelperSettings:
      type: object
      required: [helperName, ownerName, ownerNameFixed, timeZone, timeZoneFixed, publicUrl, publicUrlFixed, firstRunDone, configError, features]
      additionalProperties: false
      properties:
        helperName: { type: string, description: 'What the helper is called ("Your helper" until named).' }
        ownerName: { type: ['string', 'null'], description: 'The name in the greeting ("Good morning, Robert").' }
        ownerNameFixed: { type: boolean, description: 'Set by the deployment (MWA_OWNER_NAME): read-only here.' }
        timeZone: { type: string, description: 'An IANA zone; used for the calendar, Important and reminders.' }
        timeZoneFixed: { type: boolean }
        publicUrl: { type: ['string', 'null'], description: 'Where phones reach the helper ("https://mwa.tail1a2b.ts.net"): MWA_PUBLIC_URL, the address saved here, or a tailnet name in MWA_ALLOWED_HOSTS.' }
        publicUrlFixed: { type: boolean, description: 'Set by the deployment (MWA_PUBLIC_URL): read-only here.' }
        firstRunDone: { type: boolean, description: 'First-run setup on the computer was finished or skipped (kept in app.db, not the settings file).' }
        configError: { type: ['string', 'null'], description: 'The settings file (mwa.config.json) cannot be read: what is wrong, in plain words. Show it instead of first run.' }
        features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
    PushSubscription:
      type: object
      description: 'P3: one browser''s web push subscription. The endpoint is shown only to the browser that owns it.'
      required: [id, mine, vendor, service, platform, owner, createdAt, lastOk, lastError]
      additionalProperties: false
      properties:
        id: { type: string }
        mine: { type: boolean, description: This caller's own (this device or this signed-in browser). }
        vendor: { type: string, enum: [google, apple, mozilla, microsoft, test] }
        service: { type: string, description: 'Plain words, such as "Google''s push service".' }
        platform: { type: [string, 'null'] }
        owner: { type: string, enum: [device, session, local] }
        createdAt: { type: integer }
        lastOk: { type: [integer, 'null'], description: When the push service last accepted a message for it (not proof it was shown). }
        lastError: { type: [string, 'null'] }
        endpoint: { type: string, description: Only on the caller's own subscriptions. }
    PushSettings:
      type: object
      required: [kinds, morning, timeZone, quietHours]
      additionalProperties: false
      properties:
        kinds:
          type: object
          required: [approval, waiting, result, morning]
          additionalProperties: false
          properties:
            approval: { type: boolean }
            waiting: { type: boolean }
            result: { type: boolean }
            morning: { type: boolean }
        morning: { type: string, pattern: '^[0-9]{2}:[0-9]{2}$', description: 'The morning check-in time (05:00 to 11:30), in timeZone.' }
        timeZone: { type: string }
        quietHours:
          type: object
          required: [value, fixed, invalid]
          additionalProperties: false
          properties:
            value: { type: [string, 'null'], description: 'HH:MM-HH:MM, or null for none. In timeZone, the person''s zone (P3 review). The same quiet hours Telegram respects.' }
            fixed: { type: boolean, description: Set by the deployment (MWA_QUIET_HOURS); not changeable here. }
            invalid: { type: boolean }
    Spending:
      type: object
      required: [month, limit, background, defaults]
      additionalProperties: false
      properties:
        month:
          type: object
          required: [label, usd, calls]
          additionalProperties: false
          properties:
            label: { type: string, description: '"November 2026".' }
            usd: { type: number }
            calls: { type: integer }
        limit:
          type: object
          required: [usd, fixed, state, pct]
          additionalProperties: false
          properties:
            usd: { type: ['number', 'null'], description: 'The monthly limit, or null for none.' }
            fixed: { type: boolean, description: 'Set by the deployment (MWA_MONTHLY_BUDGET_USD): read-only here.' }
            state: { type: string, enum: [none, ok, warn, over] }
            pct: { type: ['number', 'null'] }
        background:
          type: array
          description: 'This month''s work that is not a job (mail sorting, reading newsletters for dates).'
          items:
            type: object
            required: [purpose, label, usd, calls]
            additionalProperties: false
            properties:
              purpose: { type: string }
              label: { type: string }
              usd: { type: number }
              calls: { type: integer }
        defaults:
          type: object
          description: 'The default limits per kind of work. A hand-off''s and a Continue''s limit come from its estimate, up to these.'
          required: [handoffMaxUsd, continueMaxUsd, perFireUsd, perFireFixed]
          additionalProperties: false
          properties:
            handoffMaxUsd: { type: number, description: 'A hand-off''s default limit is at most this.' }
            continueMaxUsd: { type: number, description: 'Any limit (Continue, Start over) is at most this.' }
            perFireUsd: { type: ['number', 'null'], description: 'Each run of a repeating job, when it has no limit of its own (null: none).' }
            perFireFixed: { type: boolean }
    Account:
      type: object
      required: [provider, label, what, connected, needsReconnect, method, connect]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [google, outlook] }
        label: { type: string }
        what: { type: string, description: 'One sentence of what it allows: "Calendar and Gmail. I can read them and make drafts. I never send."' }
        connected: { type: boolean }
        needsReconnect: { type: boolean, description: 'The sign-in expired or was revoked: offer Reconnect.' }
        method: { type: ['string', 'null'], enum: [sign-in, app-password, null] }
        connect: { type: string, enum: [browser, code, setup], description: 'How Connect works here: a sign-in page to open, a code to type at the provider, or a one-time setup on the computer first.' }
    ConnectStart:
      type: object
      required: [kind, provider, url, message]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [browser, code, setup] }
        provider: { type: string, enum: [google, outlook] }
        url: { type: string, description: 'browser: the sign-in page; code: where to type the code; setup: the full settings.' }
        code: { type: string, description: 'code: what to type.' }
        expiresIn: { type: integer, description: 'code: seconds it stays valid.' }
        message: { type: string }
    VaultEntry:
      type: object
      required: [name, fields]
      additionalProperties: false
      properties:
        name: { type: string }
        site: { type: string }
        fields: { type: array, items: { type: string }, description: Field names only; never a value. }
        savedAt: { type: integer }
    UploadedFile:
      type: object
      required: [id, path, name, size, projectId, pages]
      additionalProperties: false
      properties:
        id: { type: string, description: 'The same as path.' }
        path: { type: string, description: 'Workspace-relative; send it in /ask `files`.' }
        name: { type: string, description: 'The cleaned name it was saved under ("rules (2).pdf" when one existed).' }
        size: { type: integer }
        projectId: { type: string }
        pages: { type: ['integer', 'null'], description: 'Pages as read_document counts them; null when it could not be counted quickly.' }
    FileRow:
      type: object
      required: [id, path, name, size, mtime]
      additionalProperties: false
      properties:
        id: { type: string }
        path: { type: string }
        name: { type: string }
        size: { type: integer }
        mtime: { type: number }
    PluginKey:
      type: object
      required: [name, label, help, optional, saved]
      additionalProperties: false
      properties:
        name: { type: string, description: The key's name (an environment variable). Its value is never sent. }
        label: { type: string }
        help: { type: [string, 'null'] }
        optional: { type: boolean }
        saved: { type: boolean, description: A value is saved on the server. }
    Plugin:
      type: object
      description: 'S1: a plug-in from the curated library.'
      required: [id, name, category, description, access, tier, source, on, keys, missing]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        access: { type: string, description: What it can touch, in plain words. }
        tier: { type: string, enum: [curated, known, arbitrary] }
        source: { type: [string, 'null'] }
        on: { type: boolean }
        keys: { type: array, items: { $ref: '#/components/schemas/PluginKey' } }
        missing: { type: array, items: { type: string }, description: Names of required keys not saved yet. }
    CustomPlugin:
      type: object
      description: 'S1: a plug-in the owner added (by hand, or from npm). Env values are never sent, and arguments that look like secrets are shown as •••.'
      required: [id, command, package, envNames]
      additionalProperties: false
      properties:
        id: { type: string }
        command: { type: string }
        package: { type: [string, 'null'] }
        envNames: { type: array, items: { type: string } }
    AddFromNpm:
      type: object
      required: [available, reason, reviewer]
      additionalProperties: false
      properties:
        available: { type: boolean }
        reason: { type: string, description: Why it is off, or who reviews packages when it is on. }
        reviewer: { type: [string, 'null'] }
    PluginList:
      type: object
      required: [plugins, custom, addFromNpm, applies]
      additionalProperties: false
      properties:
        plugins: { type: array, items: { $ref: '#/components/schemas/Plugin' } }
        custom: { type: array, items: { $ref: '#/components/schemas/CustomPlugin' } }
        addFromNpm: { $ref: '#/components/schemas/AddFromNpm' }
        applies: { type: string }
    PluginChange:
      type: object
      required: [plugin, message]
      additionalProperties: false
      properties:
        plugin: { $ref: '#/components/schemas/Plugin' }
        message: { type: string }
    PluginReview:
      type: object
      required: [package, version, verdict, summary, capabilities, redFlags, scan, reviewer, expiresAt]
      additionalProperties: false
      properties:
        package: { type: string }
        version: { type: [string, 'null'], description: The version reviewed; approving installs exactly this one. }
        verdict: { type: string, enum: [safe, caution, dangerous] }
        summary: { type: string }
        capabilities: { type: array, items: { type: string } }
        redFlags: { type: array, items: { type: string } }
        scan:
          type: object
          required: [ran, files, checksum, note]
          additionalProperties: false
          properties:
            ran: { type: boolean }
            files: { type: [integer, 'null'] }
            checksum: { type: string, enum: [verified, mismatch, unknown] }
            note: { type: [string, 'null'] }
        reviewer: { type: string }
        expiresAt: { type: integer, description: Approve before this time (ms), or review again. }
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - session: []
  - device: []
  - bearer: []
paths:
  /meta:
    get:
      operationId: getMeta
      summary: What server this is, and whether this connection can install the app.
      security: []
      responses:
        '200':
          description: Server facts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
        default: { $ref: '#/components/responses/Error' }
  /pair/codes:
    post:
      operationId: createPairCode
      summary: Make a one-time code to pair a phone (admin).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: The code; show pairUrl as a QR.
          content: { application/json: { schema: { $ref: '#/components/schemas/PairCode' } } }
        default: { $ref: '#/components/responses/Error' }
  /pair:
    post:
      operationId: pairDevice
      summary: A phone spends a one-time code and becomes a paired device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                name: { type: string, maxLength: 60 }
                platform: { type: string, maxLength: 30 }
                cookie: { type: boolean, default: true, description: 'true: set the mwa_device cookie (web app); false: return the token (phone app).' }
      responses:
        '201':
          description: Paired. Sets the mwa_device cookie unless cookie was false.
          content: { application/json: { schema: { $ref: '#/components/schemas/PairResult' } } }
        default: { $ref: '#/components/responses/Error' }
  /devices:
    get:
      operationId: listDevices
      summary: The paired devices (admin).
      responses:
        '200':
          description: Devices, newest first, revoked ones included.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                additionalProperties: false
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
        default: { $ref: '#/components/responses/Error' }
  /devices/{id}:
    patch:
      operationId: renameDevice
      summary: Rename a paired device (admin).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                type: object
                required: [device]
                additionalProperties: false
                properties:
                  device: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokeDevice
      summary: Remove a device; its next request is refused (admin).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Revoked.
          content: { application/json: { schema: { $ref: '#/components/schemas/Revoked' } } }
        default: { $ref: '#/components/responses/Error' }
  /devices/me/sign-out:
    post:
      operationId: signOutThisDevice
      summary: This device signs itself out; the browser is told to clear this site's cache and storage.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Signed out (Clear-Site-Data sent).
          content: { application/json: { schema: { $ref: '#/components/schemas/Revoked' } } }
        default: { $ref: '#/components/responses/Error' }
  /jobs:
    get:
      operationId: listJobs
      summary: What the helper is working on, has done or is waiting on, each with the server's status.
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [working, waiting, continuing, stopped_by_you, partly_done, stopped, scheduled, done] }
        - name: archived
          in: query
          required: false
          schema: { type: string, enum: ['0', '1'] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          required: false
          description: The `next` of the previous page.
          schema: { type: integer }
      responses:
        '200':
          description: The jobs, most recently changed first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobList' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getJob
      summary: One job with all its tries.
      responses:
        '200':
          description: The job and its tries, oldest try first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/estimate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: estimateJob
      summary: 'What Continue and Start over would cost and take (about). 409 for a repeating job.'
      responses:
        '200':
          description: The estimates and what they rest on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estimate' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: stopJob
      summary: 'Stop it. A running step finishes; nothing new starts; what it did is kept. A queued try will not start.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/continue:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: continueJob
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapRequest' }
      summary: 'Finish it from where it stopped (a new try of the same job), spending at most capUsd. 409 when it is already working or continuing, finished, or repeating; 400 for a bad capUsd.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/start-over:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: startJobOver
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapRequest' }
      summary: 'Do it again from the beginning (a new try of the same job), spending at most capUsd.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/open:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: openJob
      summary: 'The person opened the result, so it is no longer "ready".'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/pause:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: pauseJob
      summary: 'Pause a repeating job or a reminder (the existing schedule control).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/resume:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: resumeJob
      summary: 'Resume a paused repeating job or reminder.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelJob
      summary: 'Cancel a repeating job or a reminder (undo within ten minutes from the schedule controls).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /stream:
    get:
      operationId: openStream
      summary: Live updates (server-sent events), resumable from a cursor.
      description: |
        Events: `hello` {cursor, head}; `change` {seq, entity, id, op, data?} with `id: <seq>` (a job's change carries
        its current view in `data`); `live` {session, type, stage, at} — a running try's progress, at most once a
        second per run; `reset` {cursor, reason} — the cursor was older than what is kept: call /sync without
        `since`. A `change` with entity `today` and no data (at most every 5 s) means Today changed (a job,
        calendar, item or action changed, an approval or a sync's state moved, or the day passed midnight, 05:00, noon
        or 17:00):
        GET /today again. A comment every 15 s keeps the connection open. Reconnect with Last-Event-ID (EventSource does it).
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, pattern: '^[0-9]{1,15}$' } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, pattern: '^[0-9]{1,15}$' } }
      responses:
        '200':
          description: An event stream.
          content: { text/event-stream: { schema: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /sync:
    get:
      operationId: syncChanges
      summary: What changed since a cursor, as current objects and deletions (the phone's offline catch-up).
      description: |
        A delta is paged: at most 500 changes and about 5 MB per answer. `more: true` means call again with the returned
        `cursor` (repeat until `more` is false). Turns come as summaries (message and reply cut to 500 characters,
        `truncated: true`); the thread endpoint has them whole. A snapshot (`reset: true`) is never paged; its turns are
        each active project's latest 50.
      parameters:
        - { name: since, in: query, required: false, schema: { type: string, pattern: '^[0-9]{1,15}$' } }
        - { name: collections, in: query, required: false, description: 'Comma-separated: jobs, calendar, mail (mail is headers only), projects (archived included), turns (a snapshot holds each active project''s latest 50), important (the Important list; handled items for 30 days), today (one document: the Today composite for this caller; a delta holds it only when something it is made of changed).', schema: { type: string, default: jobs } }
      responses:
        '200':
          description: Changes. `reset` true means a full snapshot (no since, or too old).
          content:
            application/json:
              schema:
                type: object
                required: [cursor, reset, more, upserts, deletes]
                additionalProperties: false
                properties:
                  cursor: { type: integer }
                  reset: { type: boolean }
                  more: { type: boolean, description: 'More changes after this page: call again with this cursor.' }
                  upserts:
                    type: object
                    properties:
                      jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
                      calendar: { type: array, items: { $ref: '#/components/schemas/CalendarItem' } }
                      mail: { type: array, items: { $ref: '#/components/schemas/MailHeader' } }
                      projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
                      turns: { type: array, items: { $ref: '#/components/schemas/Turn' } }
                      important: { type: array, items: { $ref: '#/components/schemas/ImportantItem' } }
                      today: { type: array, items: { $ref: '#/components/schemas/Today' }, maxItems: 1 }
                  deletes:
                    type: object
                    properties:
                      jobs: { type: array, items: { type: string } }
                      calendar: { type: array, items: { type: string } }
                      mail: { type: array, items: { type: string } }
                      projects: { type: array, items: { type: string } }
                      turns: { type: array, items: { type: string } }
                      important: { type: array, items: { type: string } }
                      today: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }
  /calendar:
    get:
      operationId: getCalendar
      summary: Events and drafts in a window, merged and sorted by start, with the double-bookings in it.
      parameters:
        - { name: from, in: query, required: false, description: 'A date (local midnight) or an ISO 8601 time. Default: yesterday.', schema: { type: string } }
        - { name: to, in: query, required: false, description: 'A date (that whole day included) or an ISO 8601 time. Default: 14 days ahead. At most 62 days after from.', schema: { type: string } }
      responses:
        '200':
          description: The calendar.
          content: { application/json: { schema: { $ref: '#/components/schemas/CalendarView' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/accounts:
    get:
      operationId: getCalendarAccounts
      summary: Which calendars are connected, when they last synced, and whether one needs signing in again.
      responses:
        '200':
          description: The calendar accounts.
          content: { application/json: { schema: { $ref: '#/components/schemas/CalendarAccounts' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/refresh:
    post:
      operationId: refreshCalendar
      summary: Sync the connected calendars now (the app calls this when it opens; MWA also syncs every 30 minutes).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: The accounts after the sync, and how each went.
          content: { application/json: { schema: { $ref: '#/components/schemas/CalendarAccounts' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/drafts:
    post:
      operationId: createCalendarDraft
      summary: Add a draft from the person's own input. Nothing goes on a calendar until it is confirmed.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, start]
              additionalProperties: false
              properties:
                title: { type: string, maxLength: 300 }
                start: { type: string, description: 'ISO 8601; no offset = local time; a bare date = all day.' }
                end: { type: string, description: 'Default: an hour after start (one day when all day).' }
                allDay: { type: boolean }
                location: { type: string, maxLength: 300 }
                notes: { type: string, maxLength: 4000 }
                provider: { type: string, enum: [google, outlook], description: 'Which calendar Confirm adds it to. Default: the connected one.' }
                tz: { type: string, maxLength: 64, description: 'The IANA zone the times were entered in (the device''s). A time without an offset and an all-day date are read there; default: the calendar''s zone.' }
                projectId: { type: string }
      responses:
        '201':
          description: The new draft.
          content: { application/json: { schema: { $ref: '#/components/schemas/DraftResult' } } }
        '200':
          description: The same draft (same title and times) was already open; no second one was made.
          content: { application/json: { schema: { $ref: '#/components/schemas/DraftResult' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/drafts/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: confirmCalendarDraft
      summary: 'Put the draft on the calendar with no invites (Google sendUpdates none; Outlook with no attendees). Adds it once, however often it is sent.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider: { type: string, enum: [google, outlook] }
      responses:
        '200':
          description: Added (or it already was, `already` true).
          content: { application/json: { schema: { $ref: '#/components/schemas/DraftResult' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/drafts/{id}/remove:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: removeCalendarDraft
      summary: Remove the draft. Nothing was on the calendar, so nothing changes there.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Removed.
          content: { application/json: { schema: { $ref: '#/components/schemas/DraftResult' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/drafts/{id}.ics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCalendarDraftIcs
      summary: The draft as an iCalendar file ("Just give me a file").
      responses:
        '200':
          description: 'A VCALENDAR with one VEVENT (UTC times, CRLF, folded at 75 octets); Content-Disposition names the file.'
          content: { text/calendar: { schema: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /mail:
    get:
      operationId: listMail
      summary: 'The plain mailbox ("All email"): headers, newest first, one row per message across accounts.'
      parameters:
        - { name: before, in: query, required: false, schema: { type: string }, description: 'nextBefore from the previous page.' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: A page of headers.
          content:
            application/json:
              schema:
                type: object
                required: [mail, nextBefore, note, connected]
                additionalProperties: false
                properties:
                  mail: { type: array, items: { $ref: '#/components/schemas/MailHeader' } }
                  nextBefore: { type: ['string', 'null'] }
                  note: { type: string, description: '"Your helper reads and writes drafts. It never sends."' }
                  connected: { type: boolean, description: 'Some mail account is connected.' }
        default: { $ref: '#/components/responses/Error' }
  /mail/accounts:
    get:
      operationId: listMailAccounts
      summary: The connected mail accounts, and whether one needs reconnecting.
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [accounts, note]
                additionalProperties: false
                properties:
                  accounts: { type: array, items: { $ref: '#/components/schemas/MailAccount' } }
                  note: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /mail/refresh:
    post:
      operationId: refreshMail
      summary: 'Check the mail now (the app calls it when it opens). 200 when done within 20 s, else 202 and changes arrive on /stream.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Checked.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailRefresh' } } }
        '202':
          description: Still checking.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailRefresh' } } }
        default: { $ref: '#/components/responses/Error' }
  /mail/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: readMail
      summary: 'Open a message: its body as sanitised plain text, marked untrusted. 404 gone when it left the mailbox; 409 needs_reconnect; 502 provider_unavailable.'
      responses:
        '200':
          description: The message.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailMessage' } } }
        default: { $ref: '#/components/responses/Error' }
  /mail/{id}/draft:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: saveMailDraft
      summary: 'Save a reply as a DRAFT in that account (threaded under the message). It is never sent: the person sends it from their mail app. 409 read_only when the account was connected without drafting.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 20000, description: Plain text. }
      responses:
        '201':
          description: 'Saved to your drafts. Nothing was sent.'
          content:
            application/json:
              schema:
                type: object
                required: [saved, sent, account, draftId, alreadySaved, message, to, replyGoesElsewhere, replyNote]
                additionalProperties: false
                properties:
                  saved: { type: boolean, const: true }
                  sent: { type: boolean, const: false }
                  account: { type: string }
                  draftId: { type: ['string', 'null'] }
                  alreadySaved: { type: boolean, description: 'A retry found the draft an earlier try of this request saved; none was added.' }
                  message: { type: string }
                  to: { type: array, items: { $ref: '#/components/schemas/MailFrom' }, description: 'Who the draft is addressed to.' }
                  replyGoesElsewhere: { type: boolean }
                  replyNote: { type: ['string', 'null'] }
        default: { $ref: '#/components/responses/Error' }
  /projects:
    get:
      operationId: listProjects
      summary: The person's projects in their order, General first.
      parameters:
        - { name: archived, in: query, required: false, description: '1 includes archived projects.', schema: { type: string, enum: ['0', '1'] } }
      responses:
        '200':
          description: The projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects, importing]
                additionalProperties: false
                properties:
                  projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  importing:
                    type: ['object', 'null']
                    description: 'As /meta: older conversations still being imported into General.'
                    required: [done, total]
                    additionalProperties: false
                    properties:
                      done: { type: integer }
                      total: { type: integer }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      summary: 'A new project with an empty thread. 409 name_taken when an active project has that name.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                icon: { type: ['string', 'null'] }
      responses:
        '201':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOut' }
        default: { $ref: '#/components/responses/Error' }
  /projects/suggest:
    get:
      operationId: suggestProject
      summary: 'Where a message should go, before it is sent (no model call: the recall embedding model and the threads'' own words).'
      parameters:
        - { name: text, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 2000 } }
        - { name: from, in: query, required: false, description: 'The project the person is in (leave out from Now/Today).', schema: { type: string } }
      responses:
        '200':
          description: The suggestion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suggestion' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateProject
      summary: 'Rename, change the icon, archive or restore, or reorder. General cannot be archived (409 general).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                icon: { type: ['string', 'null'] }
                archived: { type: boolean }
                sort: { type: integer }
      responses:
        '200':
          description: The project after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOut' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/thread:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProjectThread
      summary: A project's thread, oldest first, a page at a time (the latest page without `before`).
      parameters:
        - { name: before, in: query, required: false, description: 'The `next` of the previous page: a position in the thread, valid even if the turn it came from was moved away since.', schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [project, turns, next]
                additionalProperties: false
                properties:
                  project: { $ref: '#/components/schemas/Project' }
                  turns: { type: array, items: { $ref: '#/components/schemas/Turn' } }
                  next: { type: ['string', 'null'], description: 'Pass as `before` for the page before; null at the start of the thread.' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendProjectMessage
      summary: 'Send a message into a project''s thread. Answers once the run has started (follow it on /stream: `live` for its progress, `change` for the turn) or when it is offered to the background. 409 busy while an answer is being written there.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 8000 }
                stay: { type: boolean, description: 'Do it here, not in the background (the answer to an offer).' }
      responses:
        '202':
          description: Started, or offered to the background.
          content:
            application/json:
              schema:
                type: object
                required: [session, state]
                additionalProperties: false
                properties:
                  session: { type: string, description: 'The thread''s live key on /stream (p-<project id>).' }
                  state: { type: string, enum: [started, offer] }
                  runId: { type: string }
                  turnId: { type: string }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/work:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProjectWork
      summary: The jobs working for a project, most recently changed first (General also lists jobs no project claims).
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                additionalProperties: false
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/files:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProjectFiles
      summary: 'A project''s files: its thread''s folder, and the folders of the older conversations its turns came from. Open one with /api/files/raw?path=.'
      responses:
        '200':
          description: The files, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [files, folder]
                additionalProperties: false
                properties:
                  folder: { type: string, description: 'Where its new files go (relative to the workspace).' }
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, size, mtime]
                      additionalProperties: false
                      properties:
                        path: { type: string }
                        size: { type: integer }
                        mtime: { type: number }
        default: { $ref: '#/components/responses/Error' }
  /turns/{id}/move:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: moveTurn
      summary: 'Move a message and its answer to another project. Undo is a move back to `undo.projectId`. 409 running while its answer is being written.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId: { type: string }
      responses:
        '200':
          description: The turn where it is now.
          content:
            application/json:
              schema:
                type: object
                required: [turn, from, message, undo]
                additionalProperties: false
                properties:
                  turn: { $ref: '#/components/schemas/Turn' }
                  from: { type: string }
                  message: { type: string }
                  undo:
                    type: object
                    required: [projectId]
                    additionalProperties: false
                    properties:
                      projectId: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: stopProjectRun
      summary: 'Stop the answer being written in this project. The step that is running finishes; nothing new starts. 409 nothing_running; with `runId`, 409 not_running when that run is not the one going now (it finished, or another started).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                runId: { type: string, description: 'The run the person meant (the running turn''s runId): a Stop never lands on a later run.' }
      responses:
        '200':
          description: Stopping.
          content:
            application/json:
              schema:
                type: object
                required: [stopped, message]
                additionalProperties: false
                properties:
                  stopped: { type: boolean, const: true }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/steer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: steerProjectRun
      summary: 'Add a note to the answer being written in this project (the "add to it" of a busy send). 409 nothing_running; with `runId`, 409 not_running when that run is not the one going now.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
                runId: { type: string, description: 'The run the person meant: the note never lands on a later run.' }
      responses:
        '200':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [added, message]
                additionalProperties: false
                properties:
                  added: { type: boolean, const: true }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/live:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: followProjectRun
      summary: 'Follow the answer being written in this project (server-sent events): its events so far, then live, until result or error. With nothing running: one `gone` event.'
      responses:
        '200':
          description: An event stream.
          content: { text/event-stream: { schema: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/offer/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: acceptProjectOffer
      summary: '"Work on it": the waiting offer in this thread (the latest, or the one with `message`) becomes a background job reporting here. 409 no_offer.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, description: 'The offered message, to pick that offer when several wait.' }
      responses:
        '202':
          description: Started in the background.
          content:
            application/json:
              schema:
                type: object
                required: [goal, message]
                additionalProperties: false
                properties:
                  goal: { type: string }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /items:
    get:
      operationId: listImportant
      summary: 'The Important list ("Worth a look"): what matters from every source, grouped Today / This week / Earlier, with what was skipped per group.'
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, enum: [open, handled, not-important], default: open } }
        - { name: group, in: query, required: false, schema: { type: string, enum: [today, week, earlier] } }
      responses:
        '200':
          description: The list.
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportantList' } } }
        default: { $ref: '#/components/responses/Error' }
  /items/skipped:
    get:
      operationId: listSkipped
      summary: 'The mail left out ("Show them"): headers only, newest first, each with why it was skipped.'
      parameters:
        - { name: group, in: query, required: false, schema: { type: string, enum: [today, week, earlier] } }
      responses:
        '200':
          description: The skipped messages.
          content:
            application/json:
              schema:
                type: object
                required: [group, count, skipped]
                additionalProperties: false
                properties:
                  group: { type: ['string', 'null'], enum: [today, week, earlier, null] }
                  count: { type: integer }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [mail, group, kind, reason, byYou]
                      additionalProperties: false
                      properties:
                        mail: { $ref: '#/components/schemas/MailHeader' }
                        group: { type: string, enum: [today, week, earlier] }
                        kind: { type: string }
                        reason: { type: string, description: 'Plain words: "A mailing list.", "You marked messages like this not important."' }
                        byYou: { type: boolean }
        default: { $ref: '#/components/responses/Error' }
  /items/{id}/handled:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: markItemHandled
      summary: 'Handled: the item leaves the list (it is kept under "Handled", with Undo).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: 'Handled ("Marked handled: …").'
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemChange' } } }
        default: { $ref: '#/components/responses/Error' }
  /items/{id}/unhandle:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: unhandleItem
      summary: 'The Undo of Handled: the item is back on the list.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Back on the list.
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemChange' } } }
        default: { $ref: '#/components/responses/Error' }
  /items/{id}/not-important:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: markItemNotImportant
      summary: 'Not important: the item leaves, and (for mail) the filter learns — messages like it from that sender, domain or kind are skipped from now on, with no model call.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scope: { type: string, enum: [sender, domain, kind], default: sender }
      responses:
        '200':
          description: Learned.
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemChange' } } }
        default: { $ref: '#/components/responses/Error' }
  /mail/{id}/important:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: markMailImportant
      summary: '"This was important" on a skipped message: it joins the list, and messages from that sender are shown from now on.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: 'Learned ("Thanks — I''ll show messages like this from The Batch.").'
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemChange' } } }
        default: { $ref: '#/components/responses/Error' }
  /items/{id}/action:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: runItemAction
      summary: 'The item''s one action, on the person''s tap: Add to calendar makes an MWA-held DRAFT (helper-after-reading, confirmed separately); Remind me sets a reminder delivered as written; the rest say where to go (reader, job, Settings, approval, Ask).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Done, or where to go.
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemActionResult' } } }
        '201':
          description: A calendar draft was made.
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemActionResult' } } }
        default: { $ref: '#/components/responses/Error' }
  /important/refresh:
    post:
      operationId: refreshImportant
      summary: 'Sort new mail and rebuild the list now. 200 when done within 20 s, else 202 and changes arrive on /stream.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Sorted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportantRefresh' }
        '202':
          description: Still sorting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportantRefresh' }
        default: { $ref: '#/components/responses/Error' }
  /triage/rules:
    get:
      operationId: listTriageRules
      summary: 'The rules the person taught, each with what it decides in the cached mail now.'
      responses:
        '200':
          description: The rules.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                additionalProperties: false
                properties:
                  rules: { type: array, items: { $ref: '#/components/schemas/TriageRule' } }
        default: { $ref: '#/components/responses/Error' }
  /triage/rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteTriageRule
      summary: 'Undo a rule: the mail it decided is sorted as usual again.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed, message]
                additionalProperties: false
                properties:
                  removed:
                    type: object
                    required: [id, match, value, verdict]
                    additionalProperties: false
                    properties:
                      id: { type: string }
                      match: { type: string, enum: [sender, domain, list-id, kind] }
                      value: { type: string }
                      verdict: { type: string, enum: [important, skip] }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /ask:
    post:
      operationId: ask
      summary: 'Ask, or hand over a job. Routed to the project given, the project of the thing it is about, or a suggestion. An ordinary ask runs now in that thread; a big one (more than 20 steps, more than 30¢, more than 40 attached pages, or "learn everything / go through all / review all / triage") comes back as a plan; mode background hands it to a job at once. POST only: what is asked never sits in a URL.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 8000 }
                projectId: { type: string }
                about:
                  type: object
                  description: '"Ask about this": the item (A9 Important), email, calendar event or draft, job, or double-booking (conflict:<a>|<b>). Its own text goes to the run fenced, never into the instruction; 8 steps, 5¢.'
                  required: [kind, id]
                  properties:
                    kind: { type: string, enum: [item, mail, event, draft, job, conflict] }
                    id: { type: string }
                files: { type: array, maxItems: 10, items: { type: string }, description: 'Workspace paths of uploaded files.' }
                mode: { type: string, enum: [auto, now, background], default: auto }
                capUsd: { type: number, minimum: 0.01, maximum: 20, description: 'The most it may spend (now: the run; background: the job).' }
                source: { type: string, enum: [typed, voice], default: typed, description: 'voice: the words came from the browser''s speech recognition.' }
      responses:
        '202':
          description: Answering, planned, or handed to the background.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AskStart' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: listAsksAbout
      summary: 'The asks about one thing, oldest first: the answers shown in place under it ("You asked").'
      parameters:
        - { name: about, in: query, required: true, description: 'kind:id', schema: { type: string } }
      responses:
        '200':
          description: The asks.
          content:
            application/json:
              schema:
                type: object
                required: [about, asks]
                additionalProperties: false
                properties:
                  about: { $ref: '#/components/schemas/AskAbout' }
                  asks: { type: array, items: { $ref: '#/components/schemas/Ask' } }
        default: { $ref: '#/components/responses/Error' }
  /ask/suggestions:
    get:
      operationId: askSuggestions
      summary: '2–3 questions specific to one thing ("Remind me the day before", "Who else is going?"), from templates by kind: no model call.'
      parameters:
        - { name: about, in: query, required: true, description: 'kind:id', schema: { type: string } }
      responses:
        '200':
          description: The chip and the questions.
          content:
            application/json:
              schema:
                type: object
                required: [about, suggestions]
                additionalProperties: false
                properties:
                  about: { $ref: '#/components/schemas/AskAbout' }
                  suggestions: { type: array, minItems: 2, maxItems: 3, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }
  /ask/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAsk
      summary: An ask as it stands, with its turn in the thread once there is one.
      responses:
        '200':
          description: The ask.
          content:
            application/json:
              schema:
                type: object
                required: [ask, turn]
                additionalProperties: false
                properties:
                  ask: { $ref: '#/components/schemas/Ask' }
                  turn: { oneOf: [{ $ref: '#/components/schemas/Turn' }, { type: 'null' }] }
        default: { $ref: '#/components/responses/Error' }
  /ask/{id}/choose:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: chooseAsk
      summary: 'A plan''s choice, made once: now (main model, its limit), background (a Job on the background model tier, with the default limit or capUsd), or a narrower ask (which is asked in turn). The same choice again answers what the first did (200); another choice is 409 already_chosen; an archived project or a file gone is 409; a plan older than a day is 410 expired.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [now, background] }
                narrowIndex: { type: integer, minimum: 0, maximum: 2 }
                capUsd: { type: number, minimum: 0.01, maximum: 20 }
      responses:
        '202':
          description: Chosen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AskChosen' }
        '200':
          description: The same choice again; what the first one did.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AskChosen' }
        default: { $ref: '#/components/responses/Error' }
  /today:
    get:
      operationId: getToday
      summary: 'The Today screen in one read: Needs you, Next up, Done for you, Worth a look, the check-in or the wrap, the week line, the month and the status pill.'
      responses:
        '200':
          description: Today for this caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/Today' } } }
        default: { $ref: '#/components/responses/Error' }
  /today/seen:
    post:
      operationId: markTodaySeen
      summary: 'This caller looked at Today: Done for you lists only what comes after. Per caller (each device keeps its own).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                seenAt: { type: integer, minimum: 0, description: 'The `now` of the Today that was on screen. Clamped to [the last look, the real now]. Default: now.' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [seenAt]
                additionalProperties: false
                properties:
                  seenAt: { type: integer }
        default: { $ref: '#/components/responses/Error' }
  /today/checkin/done:
    post:
      operationId: finishCheckin
      summary: '"Done — show my day": the morning check-in is gone for today, on every device.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                day: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'The local day the tap dismissed. Not today (a tap queued yesterday): ignored, `ignored: true`.' }
      responses:
        '200':
          description: Done, with Today as it is now.
          content: { application/json: { schema: { $ref: '#/components/schemas/TodayAck' } } }
        default: { $ref: '#/components/responses/Error' }
  /today/wrap/done:
    post:
      operationId: finishWrap
      summary: '"Good night": the evening wrap is gone for today, on every device.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                day: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'The local day the tap dismissed. Not today (a tap queued yesterday): ignored, `ignored: true`.' }
      responses:
        '200':
          description: Done, with Today as it is now.
          content: { application/json: { schema: { $ref: '#/components/schemas/TodayAck' } } }
        default: { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: getMe
      summary: 'Who this request is: signed in or not, as what, with which scopes; and whether a password is set (W5).'
      security: []
      responses:
        '200':
          description: The caller.
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        default: { $ref: '#/components/responses/Error' }
  /session:
    post:
      operationId: signIn
      summary: Sign in with the password; sets the mwa_session cookie. Throttled (10 wrong tries per 10 minutes).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Signed in (Set-Cookie mwa_session).
          content: { application/json: { schema: { $ref: '#/components/schemas/SignedIn' } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: signOut
      summary: Sign this browser out of the password session.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Signed out (the cookie is cleared).
          content:
            application/json:
              schema:
                type: object
                required: [signedOut]
                additionalProperties: false
                properties:
                  signedOut: { type: boolean, const: true }
        default: { $ref: '#/components/responses/Error' }
  /session/sign-out-everywhere:
    post:
      operationId: signOutEverywhere
      summary: 'End every password session, this one included (admin). Paired devices are removed one by one.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Signed out everywhere (the cookie is cleared).
          content:
            application/json:
              schema:
                type: object
                required: [signedOut, message]
                additionalProperties: false
                properties:
                  signedOut: { type: integer, description: How many sessions ended. }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /settings:
    get:
      operationId: getSettings
      summary: 'The helper''s settings: its name, the greeting name, the time zone, first run, and the switches.'
      responses:
        '200':
          description: The settings.
          content: { application/json: { schema: { $ref: '#/components/schemas/HelperSettings' } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateSettings
      summary: Change the settings (admin). A setting the deployment fixed is refused (400 fixed).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                helperName: { type: string, maxLength: 40 }
                ownerName: { type: ['string', 'null'], maxLength: 40 }
                timeZone: { type: string }
                publicUrl: { type: ['string', 'null'], description: 'The helper''s address for phones, or null to forget it.' }
                firstRunDone: { type: boolean }
                features:
                  type: object
                  additionalProperties: false
                  properties:
                    sorting: { type: boolean }
      responses:
        '200':
          description: The settings now.
          content: { application/json: { schema: { $ref: '#/components/schemas/HelperSettings' } } }
        default: { $ref: '#/components/responses/Error' }
  /spending:
    get:
      operationId: getSpending
      summary: 'This month''s spending, the monthly limit, the background line, and the default limits per kind.'
      responses:
        '200':
          description: Spending.
          content: { application/json: { schema: { $ref: '#/components/schemas/Spending' } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateSpending
      summary: Change the monthly limit or the per-run limit for repeating jobs (admin).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                monthlyUsd: { type: ['number', 'null'], description: 'Dollars a month (at least 1), or null for no limit.' }
                perFireUsd: { type: ['number', 'null'], description: 'Dollars per run of a repeating job, rounded to the cent: $0.01 to $20. 0 or null: back to the default (25¢); never "no limit".' }
      responses:
        '200':
          description: Spending now.
          content: { application/json: { schema: { $ref: '#/components/schemas/Spending' } } }
        default: { $ref: '#/components/responses/Error' }
  /accounts:
    get:
      operationId: listAccounts
      summary: 'Google and Outlook: connected or not, whether one needs reconnecting, and how Connect works here.'
      responses:
        '200':
          description: The two accounts.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                additionalProperties: false
                properties:
                  accounts: { type: array, items: { $ref: '#/components/schemas/Account' } }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{provider}/connect:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [google, outlook] } }
    post:
      operationId: connectAccount
      summary: 'Start connecting (or reconnecting) Google or Outlook (admin): a sign-in page to open, a code, or a setup note.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: What to do next.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConnectStart' } } }
        default: { $ref: '#/components/responses/Error' }
  /vault:
    get:
      operationId: listVault
      summary: Saved logins, names and field names only (admin).
      responses:
        '200':
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                additionalProperties: false
                properties:
                  entries: { type: array, items: { $ref: '#/components/schemas/VaultEntry' } }
        default: { $ref: '#/components/responses/Error' }
  /vault/forget:
    post:
      operationId: forgetVaultEntry
      summary: Forget one saved login (admin). Jobs that used it will ask again.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Forgotten.
          content:
            application/json:
              schema:
                type: object
                required: [forgot, message]
                additionalProperties: false
                properties:
                  forgot: { type: string }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /files:
    get:
      operationId: listFiles
      summary: The files added to a project (General when no projectId), newest first.
      parameters:
        - { name: projectId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: The files.
          content:
            application/json:
              schema:
                type: object
                required: [projectId, folder, files]
                additionalProperties: false
                properties:
                  projectId: { type: string }
                  folder: { type: string }
                  files: { type: array, items: { $ref: '#/components/schemas/FileRow' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: uploadFile
      summary: 'Add a file to a project (act). The body is the file (with ?name=), or multipart/form-data with one file part. Capped at 25 MB (413); at most 2 at a time per device and 4 in all (429 busy); all added files share MWA_UPLOAD_QUOTA_MB, 2 GB (507 storage_full). The name is cleaned (no folders, dot files or Windows device names); never saved over another file.'
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: projectId, in: query, required: false, schema: { type: string } }
        - { name: name, in: query, required: false, schema: { type: string }, description: 'The file name (required for a raw body; a multipart part carries its own).' }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Saved; send `path` in /ask `files`.
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadedFile' } } }
        default: { $ref: '#/components/responses/Error' }
  /push/subscriptions:
    get:
      operationId: listPushSubscriptions
      summary: 'P3: the server''s VAPID public key, this caller''s web push subscriptions (an admin sees all), and the notification settings.'
      responses:
        '200':
          description: Subscriptions and settings.
          content:
            application/json:
              schema:
                type: object
                required: [vapidPublicKey, keysReset, subscriptions, settings]
                additionalProperties: false
                properties:
                  vapidPublicKey: { type: string, description: 'The applicationServerKey for PushManager.subscribe (base64url, an uncompressed P-256 point).' }
                  keysReset: { type: [integer, 'null'], description: 'When the key file was found unreadable and new keys were made (every device must turn notifications on again), else null.' }
                  subscriptions: { type: array, items: { $ref: '#/components/schemas/PushSubscription' } }
                  settings: { $ref: '#/components/schemas/PushSettings' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: addPushSubscription
      summary: 'P3: store this browser''s push subscription for this caller (a paired device or a password session). Only https endpoints on Google''s, Apple''s, Mozilla''s or Microsoft''s push service are accepted (400 bad_endpoint). An endpoint another live device holds is never moved (409 endpoint_taken); past the overall cap, 409 too_many. `replaces` is the endpoint it supersedes (pushsubscriptionchange).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
                expirationTime: { type: [integer, 'null'] }
                platform: { type: string }
                replaces: { type: string }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                additionalProperties: false
                properties:
                  subscription: { $ref: '#/components/schemas/PushSubscription' }
        default: { $ref: '#/components/responses/Error' }
  /push/subscriptions/{id}:
    delete:
      operationId: removePushSubscription
      summary: 'P3: remove a subscription: the caller''s own (an admin: any).'
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                additionalProperties: false
                properties:
                  removed: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /push/settings:
    patch:
      operationId: updatePushSettings
      summary: 'P3: which kinds notify, the morning time, and quiet hours (null or "off" for none). Shared by every device, so admin only; turning notifications on or off for one device is the subscription routes (act).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kinds:
                  type: object
                  properties:
                    approval: { type: boolean }
                    waiting: { type: boolean }
                    result: { type: boolean }
                    morning: { type: boolean }
                morning: { type: string }
                quietHours: { type: [string, 'null'] }
      responses:
        '200':
          description: The settings now.
          content: { application/json: { schema: { $ref: '#/components/schemas/PushSettings' } } }
        default: { $ref: '#/components/responses/Error' }
  /push/test:
    post:
      operationId: sendPushTest
      summary: 'P3: send a test notification to this caller''s own subscriptions now (quiet hours or not; at most 5 per 10 minutes). "accepted" means the push service took it, not that the phone showed it.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: What the push service said, per subscription.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, gone, failed, results, message]
                additionalProperties: false
                properties:
                  accepted: { type: integer }
                  gone: { type: integer }
                  failed: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, outcome, status]
                      additionalProperties: false
                      properties:
                        id: { type: string }
                        outcome: { type: string, enum: [accepted, gone, retry, failed] }
                        status: { type: integer }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /plugins:
    get:
      operationId: listPlugins
      summary: 'S1: plug-ins (MCP servers): the library with on/off, what each can touch and which keys are saved (names only), the owner''s own, and whether adding from npm is available.'
      responses:
        '200':
          description: The plug-ins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginList' }
        default: { $ref: '#/components/responses/Error' }
  /plugins/{id}/enable:
    post:
      operationId: enablePlugin
      summary: 'S1: turn a library plug-in on (admin). 409 needs_keys while a required key is missing. Takes effect on the next message.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: On.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginChange' }
        default: { $ref: '#/components/responses/Error' }
  /plugins/{id}/disable:
    post:
      operationId: disablePlugin
      summary: 'S1: turn a library plug-in off (admin). Takes effect on the next message.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Off.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginChange' }
        default: { $ref: '#/components/responses/Error' }
  /plugins/{id}/keys:
    put:
      operationId: savePluginKeys
      summary: 'S1: save a library plug-in''s keys (admin, write-only). Only the key names that plug-in declares (400 unknown_key otherwise); values are never sent back.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginChange' }
        default: { $ref: '#/components/responses/Error' }
  /plugins/{id}:
    delete:
      operationId: removePlugin
      summary: 'S1: remove one of the owner''s own plug-ins (admin). A library plug-in is turned off instead (400 library_plugin).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed, message]
                additionalProperties: false
                properties:
                  removed: { type: string }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /plugins/review:
    post:
      operationId: reviewPlugin
      summary: 'S1: the safety review of an npm package by the reviewing model (admin). Installs nothing. 409 npm_unavailable (with the reason) when adding from npm is off.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package]
              properties:
                package: { type: string }
      responses:
        '200':
          description: The review.
          content:
            application/json:
              schema:
                type: object
                required: [review]
                additionalProperties: false
                properties:
                  review: { $ref: '#/components/schemas/PluginReview' }
        default: { $ref: '#/components/responses/Error' }
  /plugins/approve:
    post:
      operationId: approvePlugin
      summary: 'S1: install a package this server reviewed in the last 30 minutes, at the reviewed version (admin). 409 review_first without one; a dangerous verdict needs acceptRisk true (409 risky).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package]
              properties:
                package: { type: string }
                acceptRisk: { type: boolean }
      responses:
        '200':
          description: Installed.
          content:
            application/json:
              schema:
                type: object
                required: [plugin, message]
                additionalProperties: false
                properties:
                  plugin:
                    oneOf:
                      - { $ref: '#/components/schemas/CustomPlugin' }
                      - { type: 'null' }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
