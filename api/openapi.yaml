openapi: 3.1.0
info:
  title: MWA client API
  version: 1.0.0
  description: |
    The API the MWA v2 web app (installed as a PWA) and a future phone app drive. Hand-written on purpose: this file
    is the contract a second client is built against, so internal shapes stay out of it.

    Conventions:
    - JSON in and out; every error is `{"error": {"code", "message"}}`.
    - Every write (POST/PUT/PATCH/DELETE) needs an `Idempotency-Key` header (8–128 of `A-Z a-z 0-9 . _ : -`). A retry
      with the same key gets the first answer back (`Idempotent-Replay: true`) and does not act twice.
    - Send `X-MWA-Client: web/<version>` (or `android/<version>`). A client older than `minClient` (see /meta) gets
      `426 client_too_old` and must reload.
    - Additive changes only within v1 (clients ignore fields they do not know); a breaking change is /api/v2.
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mwa_session
      description: The password session (MWA_ACCESS_PASSWORD). With no password configured, only requests made on the server's own machine are trusted without a device.
    device:
      type: apiKey
      in: cookie
      name: mwa_device
      description: A paired device, as an HttpOnly cookie (the installed web app).
    bearer:
      type: http
      scheme: bearer
      description: A paired device's token (a phone app). Not subject to the cross-site check.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, description: 'Stable, machine-readable: locked, forbidden, not_found, method_not_allowed, cross_origin, idempotency_key_required, idempotency_key_reused, in_progress, client_too_old, bad_json, bad_path, too_large, pair_code_invalid, too_many_attempts, not_a_device, internal; calendar: bad_range, bad_draft, bad_provider, removed, confirmed, no_calendar, needs_reconnect, calendar_error, deleted_in_calendar, removed_but_added; mail: bad_cursor, bad_limit, bad_body, too_long, gone, not_connected, read_only, provider_unavailable, unknown_collection; projects: bad_name, name_taken, general, archived, bad_text, bad_cursor, bad_limit, bad_body, busy, unavailable, not_movable, running, same, nothing_running, no_offer. A refusal that may not hold on a retry (in_progress, no_calendar, needs_reconnect, calendar_error, read_only, provider_unavailable, busy, unavailable) is not remembered against the Idempotency-Key: retrying with the same key runs again.' }
            message: { type: string, description: Plain words for a person. }
    Scope:
      type: string
      enum: [read, act, approve, admin]
    PairCode:
      type: object
      required: [code, expiresAt, pairUrl, scopes]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$', description: One-time, valid 10 minutes. }
        expiresAt: { type: integer }
        pairUrl: { type: string, description: 'Show as a QR code: <origin>/pair#c=CODE (the fragment never reaches a server).' }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
    PairResult:
      type: object
      required: [deviceId, scopes]
      additionalProperties: false
      properties:
        deviceId: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        token: { type: string, description: 'Only when the request asked for it (cookie false): keep it secret; it is shown once.' }
    Device:
      type: object
      required: [id, name, platform, scopes, createdAt, lastSeen, revokedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: ['string', 'null'] }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: integer }
        lastSeen: { type: ['integer', 'null'] }
        revokedAt: { type: ['integer', 'null'] }
    Revoked:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked: { type: string }
    Meta:
      type: object
      required: [api, server, minClient, secure, features, importing]
      additionalProperties: false
      properties:
        importing:
          type: ['object', 'null']
          description: 'While conversations from before projects are being imported into General: bytes done of total. Show "Importing older conversations…".'
          required: [done, total]
          additionalProperties: false
          properties:
            done: { type: integer }
            total: { type: integer }
        api: { type: string, const: v1 }
        server: { type: string, description: The server version (package.json). }
        minClient: { type: string, description: The oldest client version still accepted. }
        secure: { type: boolean, description: 'True when this request came over HTTPS or from this machine. Installing the app, offline storage and notifications need it.' }
        features: { type: array, items: { type: string } }
    Progress:
      type: [object, 'null']
      required: [done, total, unit]
      additionalProperties: false
      properties:
        done: { type: number }
        total: { type: number }
        unit: { type: string, description: 'Plural noun: pages, items, stories, steps.' }
    JobStatus:
      type: object
      description: |
        The server's word on a job, from its tries (first match wins): working › waiting (for you: an approval, or the
        dollar limit) › continuing (an automatic continuation is queued; never "failed") › stopped_by_you › partly_done
        (something is left) › stopped (could not, no progress) › scheduled (nothing has run yet) › done.
      required: [state, label, detail]
      additionalProperties: false
      properties:
        state: { type: string, enum: [working, waiting, continuing, stopped_by_you, partly_done, stopped, scheduled, done] }
        label: { type: string, description: 'The heading a person reads: "Partly done", "Result ready".' }
        detail: { type: string, description: 'One plain sentence: why, and what is left.' }
        resultReady: { type: boolean, description: 'Done, and not opened since the last try ended.' }
        primaryAction:
          type: object
          required: [action, label]
          additionalProperties: false
          properties:
            action: { type: string, enum: [stop, continue, start-over, open, review, resume] }
            label: { type: string, description: 'The button: "Finish the last 10 pages", "Continue", "Open". A Continue or Start over carries its price: "Finish the last 10 pages · about 3¢".' }
            estimate: { $ref: '#/components/schemas/Amount' }
            limitUsd: { type: number, description: 'The spending limit this action sets by default ("up to 40¢"); send capUsd to choose another.' }
            firstGuess: { type: boolean, description: 'The price rests on the default or a single sample: said as "a first guess, about 30¢".' }
    Amount:
      type: object
      description: 'An estimate, always "about": dollars rounded the way they are said (whole cents under $1, 5-cent steps above) and milliseconds.'
      required: [usd, ms]
      additionalProperties: false
      properties:
        usd: { type: number, minimum: 0 }
        ms: { type: integer, minimum: 0 }
    Estimate:
      type: object
      description: |
        What Continue (what is left) and Start over (the whole job) are expected to cost and take, and the evidence:
        `this-job` (its own tries, per unit of progress or per page), `history` (the median per page over earlier runs
        on the same model tier), or `default` (a conservative guess). `continue` is absent when nothing has run yet or
        nothing is left.
      required: [basis, samples]
      additionalProperties: false
      properties:
        continue: { $ref: '#/components/schemas/Amount' }
        startOver: { $ref: '#/components/schemas/Amount' }
        basis: { type: string, enum: [this-job, history, default] }
        samples: { type: integer, minimum: 0, description: 'How many tries or past runs it rests on.' }
    CapRequest:
      type: object
      additionalProperties: false
      properties:
        capUsd: { type: number, exclusiveMinimum: 0, maximum: 20, description: 'The most the new run may spend, in dollars. Default: twice the estimate, or the estimate plus three of its largest steps and the wrap-up, whichever is more; at least 0.25 (0.50 for a first guess); at most 20. A run that reaches it waits for you.' }
    Job:
      type: object
      required: [id, kind, title, request, projectId, createdAt, updatedSeq, status, lifecycle, progress, remaining, whereItStands, seenAt, capUsd, costUsd, tries, archived, scheduleId, goalId, session, nextRunAt, estimate, estimateVsActual]
      additionalProperties: false
      properties:
        id: { type: string }
        kind: { type: string, enum: [background, recurring, reminder, plan, live] }
        title: { type: string }
        request: { type: [string, 'null'], description: "The person's own words." }
        projectId: { type: [string, 'null'] }
        createdAt: { type: integer }
        updatedSeq: { type: integer, description: 'The event sequence of its last change (the sync cursor).' }
        status: { $ref: '#/components/schemas/JobStatus' }
        lifecycle: { type: string, enum: [active, paused, cancelled] }
        progress: { $ref: '#/components/schemas/Progress' }
        remaining: { type: [string, 'null'], description: 'What is left, as the last try said it.' }
        whereItStands:
          type: [object, 'null']
          required: [text, trust]
          additionalProperties: false
          properties:
            text: { type: string }
            trust: { type: string, enum: [high, medium, untrusted] }
        seenAt: { type: [integer, 'null'] }
        capUsd: { type: [number, 'null'], description: 'The most a run of it may spend (since you last said go); at it, it waits for you.' }
        costUsd: { type: number, description: 'Spent over all its tries.' }
        tries: { type: integer, description: 'How many tries it has.' }
        archived: { type: boolean }
        scheduleId: { type: [string, 'null'] }
        goalId: { type: [string, 'null'] }
        session: { type: [string, 'null'], description: 'The conversation it reports to.' }
        nextRunAt: { type: [integer, 'null'], description: "A repeating job's next run." }
        estimate:
          oneOf:
            - { $ref: '#/components/schemas/Estimate' }
            - { type: 'null' }
          description: 'Null for a repeating job.'
        estimateVsActual:
          type: [object, 'null']
          description: 'Once done: the first estimate it was given against what it cost ("I guessed about $0.35 · it cost $0.41").'
          required: [estimatedUsd, actualUsd, text]
          additionalProperties: false
          properties:
            estimatedUsd: { type: number }
            actualUsd: { type: number }
            text: { type: string }
    Try:
      type: object
      required: [id, n, trigger, state, dueAt, startedAt, endedAt, reason, outcome, progress, remaining, costUsd, steps, toolCalls, capHit, summary, tainted, staged, estUsd, estMs, pagesRead, endedBy, delivered]
      additionalProperties: false
      properties:
        id: { type: string }
        n: { type: integer }
        trigger: { type: string, enum: [first, auto-continue, continue, start-over, fire, resume-after-restart] }
        state: { type: string, enum: [queued, running, ended] }
        dueAt: { type: [integer, 'null'] }
        startedAt: { type: [integer, 'null'] }
        endedAt: { type: [integer, 'null'] }
        reason: { type: [string, 'null'], description: 'Why its run ended: done, budget, stuck, error, paused, stopped.' }
        outcome: { type: [string, 'null'], description: 'What it achieved: changed, no-change, could-not, blocked, complete.' }
        progress: { $ref: '#/components/schemas/Progress' }
        remaining: { type: [string, 'null'] }
        costUsd: { type: [number, 'null'] }
        steps: { type: [integer, 'null'] }
        toolCalls: { type: [integer, 'null'] }
        capHit: { type: [string, 'null'], description: 'The hard limit that ended it: steps, wall, tokens, or usd (the dollar limit you set: it waits for you).' }
        summary: { type: [string, 'null'] }
        tainted: { type: boolean }
        staged: { type: array, items: { type: string }, description: 'Approvals it staged.' }
        estUsd: { type: [number, 'null'], description: 'What it was expected to cost when it was queued (about).' }
        estMs: { type: [integer, 'null'] }
        pagesRead: { type: [integer, 'null'] }
        endedBy: { type: [string, 'null'], enum: [person, cancel, self, goal-done, reaper, duplicate, null], description: 'Who ended it when its own run did not: the person, a cancel, the job itself, its goal being marked done, or the reaper (its process stopped).' }
        delivered: { type: [boolean, 'null'], description: 'False when its result was kept quiet (nothing new); null when not a scheduled fire.' }
    JobList:
      type: object
      required: [jobs, next]
      additionalProperties: false
      properties:
        jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        next: { type: [integer, 'null'], description: 'Pass as `before` for the next page; null on the last page.' }
    JobDetail:
      type: object
      required: [job, tries]
      additionalProperties: false
      properties:
        job: { $ref: '#/components/schemas/Job' }
        tries: { type: array, items: { $ref: '#/components/schemas/Try' } }
        message: { type: string, description: 'What happened, in plain words (after an action).' }
    CalendarItem:
      type: object
      description: |
        One thing on the calendar: an event from a connected calendar (kind `event`, from MWA's synced cache) or a draft
        MWA holds (kind `draft`, shown dashed until the person confirms it). Timed: `start`/`end` are UTC instants.
        All day: `start`/`end` are local dates (YYYY-MM-DD), end exclusive.
      required: [id, kind, title, start, end, allDay, location, provider]
      additionalProperties: false
      properties:
        id: { type: string, description: 'An event: "<account>:<provider id>". A draft: "cd_…".' }
        kind: { type: string, enum: [event, draft] }
        title: { type: string }
        start: { type: string }
        end: { type: string }
        allDay: { type: boolean }
        location: { type: [string, 'null'] }
        provider: { type: [string, 'null'], enum: [google, outlook, null], description: 'Which calendar; a draft not yet tied to one is null.' }
        state: { type: string, enum: [draft, confirmed, removed], description: 'Drafts only.' }
        confirmedAt: { type: [integer, 'null'], description: 'Drafts only: when the person confirmed it (ms).' }
        addedByHelper: { type: boolean, description: 'Events only: a draft the person confirmed through MWA.' }
        origin: { type: string, enum: [you, helper, helper-after-reading], description: 'Drafts only: who proposed it. helper-after-reading = the helper had read outside content (an email, a web page) first; check it before confirming.' }
        originNote: { type: string, description: 'Drafts only: a plain line about where it came from, when there is one.' }
    CalendarConflict:
      type: object
      description: Two timed things that overlap (all-day, declined and cancelled events are not counted).
      required: [id, between, titles, start, end]
      additionalProperties: false
      properties:
        id: { type: string }
        between: { type: array, items: { type: string }, minItems: 2, maxItems: 2, description: CalendarItem ids. }
        titles: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        start: { type: string, description: The overlap's start (UTC). }
        end: { type: string, description: The overlap's end (UTC). }
    CalendarView:
      type: object
      required: [from, to, items, conflicts]
      additionalProperties: false
      properties:
        from: { type: string }
        to: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/CalendarItem' } }
        conflicts: { type: array, items: { $ref: '#/components/schemas/CalendarConflict' } }
    CalendarAccount:
      type: object
      required: [account, provider, label, connected, needsReconnect, lastOk, lastError]
      additionalProperties: false
      properties:
        account: { type: string }
        provider: { type: string, enum: [google, outlook] }
        label: { type: string, description: '"Google Calendar", "Outlook".' }
        connected: { type: boolean }
        needsReconnect: { type: boolean, description: 'The sign-in was revoked or expired: ask the person to connect it again.' }
        lastOk: { type: [integer, 'null'], description: Last successful sync (ms). }
        lastError: { type: [string, 'null'] }
    CalendarAccounts:
      type: object
      required: [accounts]
      additionalProperties: false
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/CalendarAccount' } }
        results:
          type: array
          items:
            type: object
            required: [account, ok]
            additionalProperties: false
            properties:
              account: { type: string }
              ok: { type: boolean }
              skipped: { type: string, enum: [not_connected] }
              error: { type: string }
    DraftResult:
      type: object
      required: [draft, message]
      additionalProperties: false
      properties:
        draft: { $ref: '#/components/schemas/CalendarItem' }
        message: { type: string, description: 'The receipt, in plain words: "Added by your helper just now. No invites were sent."' }
        already: { type: boolean, description: 'Confirm only: it was already on the calendar; nothing new was added.' }
    MailHeader:
      type: object
      description: 'One message in the inbox, headers only (bodies are never synced or stored). The same email in two accounts is one MailHeader (the newest copy), with the others in alsoIn.'
      required: [id, account, provider, threadId, from, subject, snippet, receivedAt, unread, labels, listId, hasUnsub, alsoIn, updatedSeq]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^m_[A-Za-z0-9_-]+$', description: Opaque. }
        account: { type: string, description: 'The connected account: gmail, imap or outlook.' }
        provider: { type: string, enum: [gmail, imap, outlook] }
        threadId: { type: ['string', 'null'] }
        from: { $ref: '#/components/schemas/MailFrom' }
        subject: { type: string }
        snippet: { type: string, maxLength: 200, description: 'One line of plain text (links shown as hosts). Empty for IMAP.' }
        receivedAt: { type: integer }
        unread: { type: boolean }
        labels: { type: array, items: { type: string }, description: 'Gmail labels incl. categories (CATEGORY_PROMOTIONS and so on); Outlook categories and inference:focused or inference:other.' }
        listId: { type: ['string', 'null'], description: 'The List-Id (mailing lists, newsletters).' }
        hasUnsub: { type: boolean, description: 'It carries an unsubscribe option (List-Unsubscribe).' }
        alsoIn: { type: array, items: { type: string }, description: 'Other accounts holding a copy of the same email.' }
        updatedSeq: { type: integer }
    MailFrom:
      type: object
      required: [name, addr]
      additionalProperties: false
      properties:
        name: { type: ['string', 'null'] }
        addr: { type: ['string', 'null'] }
    MailMessage:
      type: object
      description: 'A message opened in the reader. The body is fetched from the provider now, sanitised to plain text and kept only briefly in the server memory. It is UNTRUSTED content: show it as text, never as HTML, and fence it before a model reads it.'
      required: [id, account, provider, threadId, from, subject, snippet, receivedAt, unread, labels, listId, hasUnsub, alsoIn, updatedSeq, to, replyTo, replyGoesElsewhere, replyNote, bodyText, truncated, tooComplex, quotedLinesHidden, imagesHidden, trackersRemoved, trust, fetchedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        account: { type: string }
        provider: { type: string, enum: [gmail, imap, outlook] }
        threadId: { type: ['string', 'null'] }
        from: { $ref: '#/components/schemas/MailFrom' }
        subject: { type: string }
        snippet: { type: string }
        receivedAt: { type: integer }
        unread: { type: boolean }
        labels: { type: array, items: { type: string } }
        listId: { type: ['string', 'null'] }
        hasUnsub: { type: boolean }
        alsoIn: { type: array, items: { type: string } }
        updatedSeq: { type: integer }
        to: { type: string, description: 'The recipients line, cleaned; anything that is not a plain address shows as (unreadable address).' }
        replyTo: { type: array, items: { $ref: '#/components/schemas/MailFrom' }, description: 'Where a reply goes: the Reply-To, else the sender.' }
        replyGoesElsewhere: { type: boolean, description: 'A reply would go somewhere other than the sender (the Reply-To names another address).' }
        replyNote: { type: ['string', 'null'], description: '"Your reply will go to … (not the sender)." when replyGoesElsewhere.' }
        tooComplex: { type: boolean, description: 'The HTML could not be converted within the time budget: bodyText is the plain-text part, or a note to open it in the mail app.' }
        bodyText: { type: string, description: 'Plain text, at most 100 KB: no remote images or tracking pixels, hidden text removed, links as "words (host)" and raw URLs as their host, long quoted history collapsed to one line. Clients MUST render it as plain text with auto-linking OFF (no HTML, no linkify).' }
        truncated: { type: boolean }
        quotedLinesHidden: { type: integer }
        imagesHidden: { type: integer, description: 'Pictures not shown (their alt text appears as [picture: alt]).' }
        trackersRemoved: { type: integer, description: 'Tracking pixels removed.' }
        trust: { type: string, const: untrusted }
        fetchedAt: { type: integer }
    MailAccount:
      type: object
      required: [account, provider, label, needsReconnect, lastOk, lastError, windowFrom, syncing]
      additionalProperties: false
      properties:
        account: { type: string }
        provider: { type: string, enum: [gmail, imap, outlook] }
        label: { type: string, description: 'Gmail, Gmail (app password), Outlook.' }
        needsReconnect: { type: boolean, description: 'The sign-in is no longer valid (revoked or expired): reconnect in Settings.' }
        lastOk: { type: ['integer', 'null'] }
        lastError: { type: ['string', 'null'] }
        windowFrom: { type: ['integer', 'null'], description: 'Mail is kept from this time on (14 days).' }
        syncing: { type: boolean }
    MailRefresh:
      type: object
      required: [done, accounts, message]
      additionalProperties: false
      properties:
        done: { type: boolean }
        accounts: { type: array, items: { $ref: '#/components/schemas/MailAccount' } }
        message: { type: string }
    Project:
      type: object
      description: One of the person's groupings (Eventing, Family & school…), with one continuous thread. General always exists and cannot be archived.
      required: [id, name, icon, createdAt, sort, archived, general, updatedSeq]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: ['string', 'null'], description: 'A short icon name (letters, digits, dashes): horse, home, spark.' }
        createdAt: { type: integer }
        sort: { type: integer }
        archived: { type: boolean }
        general: { type: boolean, description: 'True for General, where a message with no clear project goes.' }
        updatedSeq: { type: integer }
    ProjectOut:
      type: object
      required: [project]
      additionalProperties: false
      properties:
        project: { $ref: '#/components/schemas/Project' }
    Turn:
      type: object
      description: |
        One entry of a project's thread. A `chat` turn holds the person's message and the answer (moving it moves both);
        `running` is a message whose answer is being written (the same turn fills in when it is done); `offer` is the
        offer to work on it in the background; `result` is a job's result posted into the thread; `divider` heads a
        conversation from before projects ("Conversation from Oct 22: …").
      required: [id, projectId, kind, ts, message, reply, truncated, reason, tainted, runId, tryId, about, provenance, offer, legacySession, movedFrom, updatedSeq]
      additionalProperties: false
      properties:
        id: { type: string }
        truncated: { type: boolean, description: 'True when message or reply was cut to 500 characters (/sync and the live stream send summaries; the thread has the whole turn).' }
        projectId: { type: string }
        kind: { type: string, enum: [chat, result, offer, running, divider] }
        ts: { type: integer }
        message: { type: string }
        reply: { type: string }
        reason: { type: ['string', 'null'] }
        tainted: { type: ['boolean', 'null'], description: 'True when the answer read outside content; null when not recorded (older turns).' }
        runId: { type: ['string', 'null'] }
        tryId: { type: ['string', 'null'] }
        about:
          type: ['object', 'null']
          required: [kind, id]
          additionalProperties: false
          properties:
            kind: { type: string }
            id: { type: string }
        provenance:
          type: array
          description: 'Where the memories this answer used came from, other than this thread: show "using what I know from <name>". projectId is null for "an earlier conversation" (from before projects).'
          items:
            type: object
            required: [projectId, name, n]
            additionalProperties: false
            properties:
              projectId: { type: ['string', 'null'] }
              name: { type: string }
              n: { type: integer, minimum: 1 }
        offer:
          type: ['object', 'null']
          required: [answered, at]
          additionalProperties: false
          properties:
            answered: { type: string, enum: [background, now] }
            goal: { type: string }
            at: { type: integer }
        legacySession: { type: ['string', 'null'], description: 'The conversation it came from before projects (its files stay in that folder).' }
        movedFrom: { type: ['string', 'null'], description: 'The project it was last moved out of.' }
        updatedSeq: { type: integer }
    Suggestion:
      type: object
      description: |
        Where a message should go. Inside a project: that project ("this project"), and at most one alternative — a hint
        to offer, never a switch. From Now/Today or General: the best project ("suggested"), or General ("not sure") with
        the closest projects as alternatives.
      required: [projectId, confidence, alternatives]
      additionalProperties: false
      properties:
        projectId: { type: string }
        confidence: { type: string, enum: [suggested, not sure, this project] }
        alternatives:
          type: array
          items:
            type: object
            required: [projectId, name, score]
            additionalProperties: false
            properties:
              projectId: { type: string }
              name: { type: string }
              score: { type: number }
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - session: []
  - device: []
  - bearer: []
paths:
  /meta:
    get:
      operationId: getMeta
      summary: What server this is, and whether this connection can install the app.
      security: []
      responses:
        '200':
          description: Server facts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
        default: { $ref: '#/components/responses/Error' }
  /pair/codes:
    post:
      operationId: createPairCode
      summary: Make a one-time code to pair a phone (admin).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: The code; show pairUrl as a QR.
          content: { application/json: { schema: { $ref: '#/components/schemas/PairCode' } } }
        default: { $ref: '#/components/responses/Error' }
  /pair:
    post:
      operationId: pairDevice
      summary: A phone spends a one-time code and becomes a paired device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                name: { type: string, maxLength: 60 }
                platform: { type: string, maxLength: 30 }
                cookie: { type: boolean, default: true, description: 'true: set the mwa_device cookie (web app); false: return the token (phone app).' }
      responses:
        '201':
          description: Paired. Sets the mwa_device cookie unless cookie was false.
          content: { application/json: { schema: { $ref: '#/components/schemas/PairResult' } } }
        default: { $ref: '#/components/responses/Error' }
  /devices:
    get:
      operationId: listDevices
      summary: The paired devices (admin).
      responses:
        '200':
          description: Devices, newest first, revoked ones included.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                additionalProperties: false
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
        default: { $ref: '#/components/responses/Error' }
  /devices/{id}:
    delete:
      operationId: revokeDevice
      summary: Remove a device; its next request is refused (admin).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Revoked.
          content: { application/json: { schema: { $ref: '#/components/schemas/Revoked' } } }
        default: { $ref: '#/components/responses/Error' }
  /devices/me/sign-out:
    post:
      operationId: signOutThisDevice
      summary: This device signs itself out; the browser is told to clear this site's cache and storage.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Signed out (Clear-Site-Data sent).
          content: { application/json: { schema: { $ref: '#/components/schemas/Revoked' } } }
        default: { $ref: '#/components/responses/Error' }
  /jobs:
    get:
      operationId: listJobs
      summary: What the helper is working on, has done or is waiting on, each with the server's status.
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [working, waiting, continuing, stopped_by_you, partly_done, stopped, scheduled, done] }
        - name: archived
          in: query
          required: false
          schema: { type: string, enum: ['0', '1'] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          required: false
          description: The `next` of the previous page.
          schema: { type: integer }
      responses:
        '200':
          description: The jobs, most recently changed first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobList' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getJob
      summary: One job with all its tries.
      responses:
        '200':
          description: The job and its tries, oldest try first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/estimate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: estimateJob
      summary: 'What Continue and Start over would cost and take (about). 409 for a repeating job.'
      responses:
        '200':
          description: The estimates and what they rest on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estimate' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: stopJob
      summary: 'Stop it. A running step finishes; nothing new starts; what it did is kept. A queued try will not start.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/continue:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: continueJob
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapRequest' }
      summary: 'Finish it from where it stopped (a new try of the same job), spending at most capUsd. 409 when it is already working or continuing, finished, or repeating; 400 for a bad capUsd.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/start-over:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: startJobOver
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapRequest' }
      summary: 'Do it again from the beginning (a new try of the same job), spending at most capUsd.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/open:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: openJob
      summary: 'The person opened the result, so it is no longer "ready".'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/pause:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: pauseJob
      summary: 'Pause a repeating job or a reminder (the existing schedule control).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/resume:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: resumeJob
      summary: 'Resume a paused repeating job or reminder.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelJob
      summary: 'Cancel a repeating job or a reminder (undo within ten minutes from the schedule controls).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /stream:
    get:
      operationId: openStream
      summary: Live updates (server-sent events), resumable from a cursor.
      description: |
        Events: `hello` {cursor, head}; `change` {seq, entity, id, op, data?} with `id: <seq>` (a job's change carries
        its current view in `data`); `live` {session, type, stage, at} — a running try's progress, at most once a
        second per run; `reset` {cursor, reason} — the cursor was older than what is kept: call /sync without
        `since`. A comment every 15 s keeps the connection open. Reconnect with Last-Event-ID (EventSource does it).
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, pattern: '^[0-9]{1,15}$' } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, pattern: '^[0-9]{1,15}$' } }
      responses:
        '200':
          description: An event stream.
          content: { text/event-stream: { schema: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /sync:
    get:
      operationId: syncChanges
      summary: What changed since a cursor, as current objects and deletions (the phone's offline catch-up).
      description: |
        A delta is paged: at most 500 changes and about 5 MB per answer. `more: true` means call again with the returned
        `cursor` (repeat until `more` is false). Turns come as summaries (message and reply cut to 500 characters,
        `truncated: true`); the thread endpoint has them whole. A snapshot (`reset: true`) is never paged; its turns are
        each active project's latest 50.
      parameters:
        - { name: since, in: query, required: false, schema: { type: string, pattern: '^[0-9]{1,15}$' } }
        - { name: collections, in: query, required: false, description: 'Comma-separated: jobs, calendar, mail (mail is headers only), projects (archived included), turns (a snapshot holds each active project''s latest 50).', schema: { type: string, default: jobs } }
      responses:
        '200':
          description: Changes. `reset` true means a full snapshot (no since, or too old).
          content:
            application/json:
              schema:
                type: object
                required: [cursor, reset, more, upserts, deletes]
                additionalProperties: false
                properties:
                  cursor: { type: integer }
                  reset: { type: boolean }
                  more: { type: boolean, description: 'More changes after this page: call again with this cursor.' }
                  upserts:
                    type: object
                    properties:
                      jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
                      calendar: { type: array, items: { $ref: '#/components/schemas/CalendarItem' } }
                      mail: { type: array, items: { $ref: '#/components/schemas/MailHeader' } }
                      projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
                      turns: { type: array, items: { $ref: '#/components/schemas/Turn' } }
                  deletes:
                    type: object
                    properties:
                      jobs: { type: array, items: { type: string } }
                      calendar: { type: array, items: { type: string } }
                      mail: { type: array, items: { type: string } }
                      projects: { type: array, items: { type: string } }
                      turns: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }
  /calendar:
    get:
      operationId: getCalendar
      summary: Events and drafts in a window, merged and sorted by start, with the double-bookings in it.
      parameters:
        - { name: from, in: query, required: false, description: 'A date (local midnight) or an ISO 8601 time. Default: yesterday.', schema: { type: string } }
        - { name: to, in: query, required: false, description: 'A date (that whole day included) or an ISO 8601 time. Default: 14 days ahead. At most 62 days after from.', schema: { type: string } }
      responses:
        '200':
          description: The calendar.
          content: { application/json: { schema: { $ref: '#/components/schemas/CalendarView' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/accounts:
    get:
      operationId: getCalendarAccounts
      summary: Which calendars are connected, when they last synced, and whether one needs signing in again.
      responses:
        '200':
          description: The calendar accounts.
          content: { application/json: { schema: { $ref: '#/components/schemas/CalendarAccounts' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/refresh:
    post:
      operationId: refreshCalendar
      summary: Sync the connected calendars now (the app calls this when it opens; MWA also syncs every 30 minutes).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: The accounts after the sync, and how each went.
          content: { application/json: { schema: { $ref: '#/components/schemas/CalendarAccounts' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/drafts:
    post:
      operationId: createCalendarDraft
      summary: Add a draft from the person's own input. Nothing goes on a calendar until it is confirmed.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, start]
              additionalProperties: false
              properties:
                title: { type: string, maxLength: 300 }
                start: { type: string, description: 'ISO 8601; no offset = local time; a bare date = all day.' }
                end: { type: string, description: 'Default: an hour after start (one day when all day).' }
                allDay: { type: boolean }
                location: { type: string, maxLength: 300 }
                notes: { type: string, maxLength: 4000 }
                provider: { type: string, enum: [google, outlook], description: 'Which calendar Confirm adds it to. Default: the connected one.' }
                projectId: { type: string }
      responses:
        '201':
          description: The new draft.
          content: { application/json: { schema: { $ref: '#/components/schemas/DraftResult' } } }
        '200':
          description: The same draft (same title and times) was already open; no second one was made.
          content: { application/json: { schema: { $ref: '#/components/schemas/DraftResult' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/drafts/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: confirmCalendarDraft
      summary: 'Put the draft on the calendar with no invites (Google sendUpdates none; Outlook with no attendees). Adds it once, however often it is sent.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider: { type: string, enum: [google, outlook] }
      responses:
        '200':
          description: Added (or it already was, `already` true).
          content: { application/json: { schema: { $ref: '#/components/schemas/DraftResult' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/drafts/{id}/remove:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: removeCalendarDraft
      summary: Remove the draft. Nothing was on the calendar, so nothing changes there.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Removed.
          content: { application/json: { schema: { $ref: '#/components/schemas/DraftResult' } } }
        default: { $ref: '#/components/responses/Error' }
  /calendar/drafts/{id}.ics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCalendarDraftIcs
      summary: The draft as an iCalendar file ("Just give me a file").
      responses:
        '200':
          description: 'A VCALENDAR with one VEVENT (UTC times, CRLF, folded at 75 octets); Content-Disposition names the file.'
          content: { text/calendar: { schema: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /mail:
    get:
      operationId: listMail
      summary: 'The plain mailbox ("All email"): headers, newest first, one row per message across accounts.'
      parameters:
        - { name: before, in: query, required: false, schema: { type: string }, description: 'nextBefore from the previous page.' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: A page of headers.
          content:
            application/json:
              schema:
                type: object
                required: [mail, nextBefore, note, connected]
                additionalProperties: false
                properties:
                  mail: { type: array, items: { $ref: '#/components/schemas/MailHeader' } }
                  nextBefore: { type: ['string', 'null'] }
                  note: { type: string, description: '"Your helper reads and writes drafts. It never sends."' }
                  connected: { type: boolean, description: 'Some mail account is connected.' }
        default: { $ref: '#/components/responses/Error' }
  /mail/accounts:
    get:
      operationId: listMailAccounts
      summary: The connected mail accounts, and whether one needs reconnecting.
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [accounts, note]
                additionalProperties: false
                properties:
                  accounts: { type: array, items: { $ref: '#/components/schemas/MailAccount' } }
                  note: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /mail/refresh:
    post:
      operationId: refreshMail
      summary: 'Check the mail now (the app calls it when it opens). 200 when done within 20 s, else 202 and changes arrive on /stream.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Checked.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailRefresh' } } }
        '202':
          description: Still checking.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailRefresh' } } }
        default: { $ref: '#/components/responses/Error' }
  /mail/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: readMail
      summary: 'Open a message: its body as sanitised plain text, marked untrusted. 404 gone when it left the mailbox; 409 needs_reconnect; 502 provider_unavailable.'
      responses:
        '200':
          description: The message.
          content: { application/json: { schema: { $ref: '#/components/schemas/MailMessage' } } }
        default: { $ref: '#/components/responses/Error' }
  /mail/{id}/draft:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: saveMailDraft
      summary: 'Save a reply as a DRAFT in that account (threaded under the message). It is never sent: the person sends it from their mail app. 409 read_only when the account was connected without drafting.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 20000, description: Plain text. }
      responses:
        '201':
          description: 'Saved to your drafts. Nothing was sent.'
          content:
            application/json:
              schema:
                type: object
                required: [saved, sent, account, draftId, alreadySaved, message, to, replyGoesElsewhere, replyNote]
                additionalProperties: false
                properties:
                  saved: { type: boolean, const: true }
                  sent: { type: boolean, const: false }
                  account: { type: string }
                  draftId: { type: ['string', 'null'] }
                  alreadySaved: { type: boolean, description: 'A retry found the draft an earlier try of this request saved; none was added.' }
                  message: { type: string }
                  to: { type: array, items: { $ref: '#/components/schemas/MailFrom' }, description: 'Who the draft is addressed to.' }
                  replyGoesElsewhere: { type: boolean }
                  replyNote: { type: ['string', 'null'] }
        default: { $ref: '#/components/responses/Error' }
  /projects:
    get:
      operationId: listProjects
      summary: The person's projects in their order, General first.
      parameters:
        - { name: archived, in: query, required: false, description: '1 includes archived projects.', schema: { type: string, enum: ['0', '1'] } }
      responses:
        '200':
          description: The projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects, importing]
                additionalProperties: false
                properties:
                  projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  importing:
                    type: ['object', 'null']
                    description: 'As /meta: older conversations still being imported into General.'
                    required: [done, total]
                    additionalProperties: false
                    properties:
                      done: { type: integer }
                      total: { type: integer }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      summary: 'A new project with an empty thread. 409 name_taken when an active project has that name.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                icon: { type: ['string', 'null'] }
      responses:
        '201':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOut' }
        default: { $ref: '#/components/responses/Error' }
  /projects/suggest:
    get:
      operationId: suggestProject
      summary: 'Where a message should go, before it is sent (no model call: the recall embedding model and the threads'' own words).'
      parameters:
        - { name: text, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 2000 } }
        - { name: from, in: query, required: false, description: 'The project the person is in (leave out from Now/Today).', schema: { type: string } }
      responses:
        '200':
          description: The suggestion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suggestion' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateProject
      summary: 'Rename, change the icon, archive or restore, or reorder. General cannot be archived (409 general).'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                icon: { type: ['string', 'null'] }
                archived: { type: boolean }
                sort: { type: integer }
      responses:
        '200':
          description: The project after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectOut' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/thread:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProjectThread
      summary: A project's thread, oldest first, a page at a time (the latest page without `before`).
      parameters:
        - { name: before, in: query, required: false, description: 'The `next` of the previous page: a position in the thread, valid even if the turn it came from was moved away since.', schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [project, turns, next]
                additionalProperties: false
                properties:
                  project: { $ref: '#/components/schemas/Project' }
                  turns: { type: array, items: { $ref: '#/components/schemas/Turn' } }
                  next: { type: ['string', 'null'], description: 'Pass as `before` for the page before; null at the start of the thread.' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendProjectMessage
      summary: 'Send a message into a project''s thread. Answers once the run has started (follow it on /stream: `live` for its progress, `change` for the turn) or when it is offered to the background. 409 busy while an answer is being written there.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 8000 }
                stay: { type: boolean, description: 'Do it here, not in the background (the answer to an offer).' }
      responses:
        '202':
          description: Started, or offered to the background.
          content:
            application/json:
              schema:
                type: object
                required: [session, state]
                additionalProperties: false
                properties:
                  session: { type: string, description: 'The thread''s live key on /stream (p-<project id>).' }
                  state: { type: string, enum: [started, offer] }
                  runId: { type: string }
                  turnId: { type: string }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/work:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProjectWork
      summary: The jobs working for a project, most recently changed first (General also lists jobs no project claims).
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                additionalProperties: false
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/files:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProjectFiles
      summary: 'A project''s files: its thread''s folder, and the folders of the older conversations its turns came from. Open one with /api/files/raw?path=.'
      responses:
        '200':
          description: The files, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [files, folder]
                additionalProperties: false
                properties:
                  folder: { type: string, description: 'Where its new files go (relative to the workspace).' }
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, size, mtime]
                      additionalProperties: false
                      properties:
                        path: { type: string }
                        size: { type: integer }
                        mtime: { type: number }
        default: { $ref: '#/components/responses/Error' }
  /turns/{id}/move:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: moveTurn
      summary: 'Move a message and its answer to another project. Undo is a move back to `undo.projectId`. 409 running while its answer is being written.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId: { type: string }
      responses:
        '200':
          description: The turn where it is now.
          content:
            application/json:
              schema:
                type: object
                required: [turn, from, message, undo]
                additionalProperties: false
                properties:
                  turn: { $ref: '#/components/schemas/Turn' }
                  from: { type: string }
                  message: { type: string }
                  undo:
                    type: object
                    required: [projectId]
                    additionalProperties: false
                    properties:
                      projectId: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: stopProjectRun
      summary: 'Stop the answer being written in this project. The step that is running finishes; nothing new starts. 409 nothing_running.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Stopping.
          content:
            application/json:
              schema:
                type: object
                required: [stopped, message]
                additionalProperties: false
                properties:
                  stopped: { type: boolean, const: true }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/steer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: steerProjectRun
      summary: 'Add a note to the answer being written in this project (the "add to it" of a busy send). 409 nothing_running.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [added, message]
                additionalProperties: false
                properties:
                  added: { type: boolean, const: true }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/live:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: followProjectRun
      summary: 'Follow the answer being written in this project (server-sent events): its events so far, then live, until result or error. With nothing running: one `gone` event.'
      responses:
        '200':
          description: An event stream.
          content: { text/event-stream: { schema: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /projects/{id}/offer/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: acceptProjectOffer
      summary: '"Work on it": the waiting offer in this thread (the latest, or the one with `message`) becomes a background job reporting here. 409 no_offer.'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, description: 'The offered message, to pick that offer when several wait.' }
      responses:
        '202':
          description: Started in the background.
          content:
            application/json:
              schema:
                type: object
                required: [goal, message]
                additionalProperties: false
                properties:
                  goal: { type: string }
                  message: { type: string }
        default: { $ref: '#/components/responses/Error' }
