openapi: 3.1.0
info:
  title: MWA client API
  version: 1.0.0
  description: |
    The API the MWA v2 web app (installed as a PWA) and a future phone app drive. Hand-written on purpose: this file
    is the contract a second client is built against, so internal shapes stay out of it.

    Conventions:
    - JSON in and out; every error is `{"error": {"code", "message"}}`.
    - Every write (POST/PUT/PATCH/DELETE) needs an `Idempotency-Key` header (8–128 of `A-Z a-z 0-9 . _ : -`). A retry
      with the same key gets the first answer back (`Idempotent-Replay: true`) and does not act twice.
    - Send `X-MWA-Client: web/<version>` (or `android/<version>`). A client older than `minClient` (see /meta) gets
      `426 client_too_old` and must reload.
    - Additive changes only within v1 (clients ignore fields they do not know); a breaking change is /api/v2.
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mwa_session
      description: The password session (MWA_ACCESS_PASSWORD). With no password configured, only requests made on the server's own machine are trusted without a device.
    device:
      type: apiKey
      in: cookie
      name: mwa_device
      description: A paired device, as an HttpOnly cookie (the installed web app).
    bearer:
      type: http
      scheme: bearer
      description: A paired device's token (a phone app). Not subject to the cross-site check.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { type: string, description: 'Stable, machine-readable: locked, forbidden, not_found, method_not_allowed, cross_origin, idempotency_key_required, idempotency_key_reused, in_progress, client_too_old, bad_json, bad_path, too_large, pair_code_invalid, too_many_attempts, not_a_device, internal' }
            message: { type: string, description: Plain words for a person. }
    Scope:
      type: string
      enum: [read, act, approve, admin]
    PairCode:
      type: object
      required: [code, expiresAt, pairUrl, scopes]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$', description: One-time, valid 10 minutes. }
        expiresAt: { type: integer }
        pairUrl: { type: string, description: 'Show as a QR code: <origin>/pair#c=CODE (the fragment never reaches a server).' }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
    PairResult:
      type: object
      required: [deviceId, scopes]
      additionalProperties: false
      properties:
        deviceId: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        token: { type: string, description: 'Only when the request asked for it (cookie false): keep it secret; it is shown once.' }
    Device:
      type: object
      required: [id, name, platform, scopes, createdAt, lastSeen, revokedAt]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: ['string', 'null'] }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: integer }
        lastSeen: { type: ['integer', 'null'] }
        revokedAt: { type: ['integer', 'null'] }
    Revoked:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked: { type: string }
    Meta:
      type: object
      required: [api, server, minClient, secure, features]
      additionalProperties: false
      properties:
        api: { type: string, const: v1 }
        server: { type: string, description: The server version (package.json). }
        minClient: { type: string, description: The oldest client version still accepted. }
        secure: { type: boolean, description: 'True when this request came over HTTPS or from this machine. Installing the app, offline storage and notifications need it.' }
        features: { type: array, items: { type: string } }
    Progress:
      type: [object, 'null']
      required: [done, total, unit]
      additionalProperties: false
      properties:
        done: { type: number }
        total: { type: number }
        unit: { type: string, description: 'Plural noun: pages, items, stories, steps.' }
    JobStatus:
      type: object
      description: |
        The server's word on a job, from its tries (first match wins): working › waiting (for you: an approval, or the
        dollar limit) › continuing (an automatic continuation is queued; never "failed") › stopped_by_you › partly_done
        (something is left) › stopped (could not, no progress) › scheduled (nothing has run yet) › done.
      required: [state, label, detail]
      additionalProperties: false
      properties:
        state: { type: string, enum: [working, waiting, continuing, stopped_by_you, partly_done, stopped, scheduled, done] }
        label: { type: string, description: 'The heading a person reads: "Partly done", "Result ready".' }
        detail: { type: string, description: 'One plain sentence: why, and what is left.' }
        resultReady: { type: boolean, description: 'Done, and not opened since the last try ended.' }
        primaryAction:
          type: object
          required: [action, label]
          additionalProperties: false
          properties:
            action: { type: string, enum: [stop, continue, start-over, open, review, resume] }
            label: { type: string, description: 'The button: "Finish the last 10 pages", "Continue", "Open".' }
    Job:
      type: object
      required: [id, kind, title, request, projectId, createdAt, updatedSeq, status, lifecycle, progress, remaining, whereItStands, seenAt, capUsd, costUsd, tries, archived, scheduleId, goalId, session]
      additionalProperties: false
      properties:
        id: { type: string }
        kind: { type: string, enum: [background, recurring, reminder, plan, live] }
        title: { type: string }
        request: { type: [string, 'null'], description: "The person's own words." }
        projectId: { type: [string, 'null'] }
        createdAt: { type: integer }
        updatedSeq: { type: integer, description: 'The event sequence of its last change (the sync cursor).' }
        status: { $ref: '#/components/schemas/JobStatus' }
        lifecycle: { type: string, enum: [active, paused, cancelled] }
        progress: { $ref: '#/components/schemas/Progress' }
        remaining: { type: [string, 'null'], description: 'What is left, as the last try said it.' }
        whereItStands:
          type: [object, 'null']
          required: [text, trust]
          additionalProperties: false
          properties:
            text: { type: string }
            trust: { type: string, enum: [high, medium, untrusted] }
        seenAt: { type: [integer, 'null'] }
        capUsd: { type: [number, 'null'] }
        costUsd: { type: number, description: 'Spent over all its tries.' }
        tries: { type: integer, description: 'How many tries it has.' }
        archived: { type: boolean }
        scheduleId: { type: [string, 'null'] }
        goalId: { type: [string, 'null'] }
        session: { type: [string, 'null'], description: 'The conversation it reports to.' }
    Try:
      type: object
      required: [id, n, trigger, state, dueAt, startedAt, endedAt, reason, outcome, progress, remaining, costUsd, steps, toolCalls, capHit, summary, tainted, staged, estUsd, estMs, pagesRead]
      additionalProperties: false
      properties:
        id: { type: string }
        n: { type: integer }
        trigger: { type: string, enum: [first, auto-continue, continue, start-over, fire, resume-after-restart] }
        state: { type: string, enum: [queued, running, ended] }
        dueAt: { type: [integer, 'null'] }
        startedAt: { type: [integer, 'null'] }
        endedAt: { type: [integer, 'null'] }
        reason: { type: [string, 'null'], description: 'Why its run ended: done, budget, stuck, error, paused, stopped.' }
        outcome: { type: [string, 'null'], description: 'What it achieved: changed, no-change, could-not, blocked, complete.' }
        progress: { $ref: '#/components/schemas/Progress' }
        remaining: { type: [string, 'null'] }
        costUsd: { type: [number, 'null'] }
        steps: { type: [integer, 'null'] }
        toolCalls: { type: [integer, 'null'] }
        capHit: { type: [string, 'null'], description: 'The hard limit that ended it: steps, wall, tokens (usd from A3b).' }
        summary: { type: [string, 'null'] }
        tainted: { type: boolean }
        staged: { type: array, items: { type: string }, description: 'Approvals it staged.' }
        estUsd: { type: [number, 'null'] }
        estMs: { type: [integer, 'null'] }
        pagesRead: { type: [integer, 'null'] }
    JobList:
      type: object
      required: [jobs]
      additionalProperties: false
      properties:
        jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
    JobDetail:
      type: object
      required: [job, tries]
      additionalProperties: false
      properties:
        job: { $ref: '#/components/schemas/Job' }
        tries: { type: array, items: { $ref: '#/components/schemas/Try' } }
        message: { type: string, description: 'What happened, in plain words (after an action).' }
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - session: []
  - device: []
  - bearer: []
paths:
  /meta:
    get:
      operationId: getMeta
      summary: What server this is, and whether this connection can install the app.
      security: []
      responses:
        '200':
          description: Server facts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
        default: { $ref: '#/components/responses/Error' }
  /pair/codes:
    post:
      operationId: createPairCode
      summary: Make a one-time code to pair a phone (admin).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: The code; show pairUrl as a QR.
          content: { application/json: { schema: { $ref: '#/components/schemas/PairCode' } } }
        default: { $ref: '#/components/responses/Error' }
  /pair:
    post:
      operationId: pairDevice
      summary: A phone spends a one-time code and becomes a paired device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                name: { type: string, maxLength: 60 }
                platform: { type: string, maxLength: 30 }
                cookie: { type: boolean, default: true, description: 'true: set the mwa_device cookie (web app); false: return the token (phone app).' }
      responses:
        '201':
          description: Paired. Sets the mwa_device cookie unless cookie was false.
          content: { application/json: { schema: { $ref: '#/components/schemas/PairResult' } } }
        default: { $ref: '#/components/responses/Error' }
  /devices:
    get:
      operationId: listDevices
      summary: The paired devices (admin).
      responses:
        '200':
          description: Devices, newest first, revoked ones included.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                additionalProperties: false
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
        default: { $ref: '#/components/responses/Error' }
  /devices/{id}:
    delete:
      operationId: revokeDevice
      summary: Remove a device; its next request is refused (admin).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Revoked.
          content: { application/json: { schema: { $ref: '#/components/schemas/Revoked' } } }
        default: { $ref: '#/components/responses/Error' }
  /devices/me/sign-out:
    post:
      operationId: signOutThisDevice
      summary: This device signs itself out; the browser is told to clear this site's cache and storage.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Signed out (Clear-Site-Data sent).
          content: { application/json: { schema: { $ref: '#/components/schemas/Revoked' } } }
        default: { $ref: '#/components/responses/Error' }
  /jobs:
    get:
      operationId: listJobs
      summary: What the helper is working on, has done or is waiting on, each with the server's status.
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [working, waiting, continuing, stopped_by_you, partly_done, stopped, scheduled, done] }
        - name: archived
          in: query
          required: false
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200':
          description: The jobs, most recently changed first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobList' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getJob
      summary: One job with all its tries.
      responses:
        '200':
          description: The job and its tries, oldest try first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: stopJob
      summary: 'Stop it. A running step finishes; nothing new starts; what it did is kept. A queued try will not start.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/continue:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: continueJob
      summary: 'Finish it from where it stopped (a new try of the same job). 409 when it is already working or continuing, finished, or repeating.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/start-over:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: startJobOver
      summary: 'Do it again from the beginning (a new try of the same job).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/open:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: openJob
      summary: 'The person opened the result, so it is no longer "ready".'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/pause:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: pauseJob
      summary: 'Pause a repeating job or a reminder (the existing schedule control).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/resume:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: resumeJob
      summary: 'Resume a paused repeating job or reminder.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelJob
      summary: 'Cancel a repeating job or a reminder (undo within ten minutes from the schedule controls).'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The job after the action, and what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        default: { $ref: '#/components/responses/Error' }
