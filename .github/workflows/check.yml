name: check

# Gate every push/PR on a green build + typecheck + tests, so a broken change
# never reaches a release tag. Runs on Linux (where the vendored AWM pglite path
# works; it's WASM-fragile only on some Windows/Node combos).
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04 # ubuntu-latest became 26.04 (2026-10), where playwright-core 1.52 has no Chromium shell
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # vendor/agent-working-memory is built from source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build       # build:awm (vendor dist) + tsc + vite UI — tests import vendor dist
      - run: npm run typecheck
      # Download the three ONNX models once, in one process, before the suite. Test files load them
      # in parallel, and two first-time downloads of the same file can leave a half-written
      # model.onnx ("Protobuf parsing failed"), which failed four tests on 2026-10-17.
      - name: Warm the AWM models
        run: >-
          node --input-type=module -e "const d='./vendor/agent-working-memory/dist/core/';
          for (const [f, g] of [['embeddings.js', 'getEmbedder'], ['reranker.js', 'getReranker'], ['query-expander.js', 'getExpander']])
          await (await import(d + f))[g]();"
      # BL-64: tests/browser.test.ts drives a real Chromium. The same headless shell the Dockerfile installs;
      # without it those tests failed on CI with "Executable doesn't exist".
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm test
